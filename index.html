<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>POS System</title>
<!-- Barcode Scanner Library -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<!-- Supabase JS Client Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #090d16;
  --panel: #111827;
  --card: #1f2937;
  --card-hover: #263346;
  --side: #0d131f;
  --side2: #1e293b;
  --line: #2d3748;
  --ink: #f3f4f6;
  --muted: #9ca3af;
  --accent: #10b981;
  --accent-hover: #059669;
  --soft: rgba(16, 185, 129, 0.15);
  --danger: #ef4444;
  --danger-hover: #dc2626;
  --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
}

*{box-sizing:border-box;margin:0;padding:0; -webkit-tap-highlight-color: transparent;}
html,body{height:100%; height: 100svh;}
body{font:15px/1.5 "Inter", system-ui, -apple-system, sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;transition:all 0.15s ease}
input{font:inherit;user-select:text;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.02em}

/* Login */
#login{position:fixed;inset:0;z-index:1000;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);height:100%}
.brand-pane{background:linear-gradient(135deg, #0f172a 0%, #060911 100%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line)}
.brand-pane h1{font-size:2.2rem;font-weight:700;line-height:1.15;background:linear-gradient(to right, #fff, #94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand-pane p{color:#94a3b8;max-width:36ch;font-size:1rem}
.role-pane{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;background:var(--bg)}
.role-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.role-pane h2{font-size:1.5rem;font-weight:600;margin-bottom:4px;color:#fff}
.role-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px 20px;background:var(--panel);border:1px solid var(--line);text-align:left;border-radius:12px;color:var(--ink);width:100%}
.role-btn:active{transform:scale(0.98)}
.role-btn b{font-size:1.1rem;color:#fff}
.role-btn span{color:var(--muted);font-size:.85rem}

/* App shell */
#app{display:flex;width:100vw;height:100%;height:100svh;position:relative;overflow:hidden}
aside{width:260px;min-width:260px;background:var(--side);color:#e2e8f0;display:flex;flex-direction:column;height:100%;border-right:1px solid var(--line);z-index:20;transition:transform 0.25s ease}
.logo{padding:18px 16px 12px;font-size:1.1rem;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;align-items:center}
.logo small{display:block;color:var(--accent);font-weight:500;font-size:.7rem;margin-top:2px;text-transform:uppercase}
.side-label{padding:12px 16px 6px;color:var(--muted);font-size:.75rem;text-transform:uppercase;font-weight:600}
#cats{flex:1;overflow-y:auto;padding:0 8px;-webkit-overflow-scrolling:touch}
.cat{display:flex;align-items:center;border-radius:8px;margin-bottom:4px;color:var(--muted)}
.cat.on{background:var(--soft);color:var(--accent);font-weight:600}
.cat-btn{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:none;color:inherit;text-align:left;font-size:0.95rem}
.cat-btn i{font-style:normal;font-size:.75rem;background:rgba(255,255,255,0.08);padding:2px 8px;border-radius:12px;color:var(--ink)}
.cat.on .cat-btn i{background:var(--accent);color:#000;font-weight:700}
.cat-del{background:none;color:#f87171;padding:10px 12px;font-size:1.1rem}
.side-foot{padding:12px;border-top:1px solid var(--line);display:grid;gap:8px;background:var(--side)}
.btn{padding:12px 16px;font-weight:600;background:var(--accent);color:#051d14;border-radius:10px;font-size:0.95rem}
.btn:active{transform:scale(0.98)}
.btn.ghost{background:var(--side2);color:var(--ink);border:1px solid var(--line)}
.btn.light{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}

main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;background:var(--bg)}
.top{display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.search{flex:1;display:flex;gap:8px;align-items:center}
.search-input-wrap{position:relative;flex:1}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:#fff;font-size:0.95rem}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.cam-btn{background:var(--accent);color:#051d14;padding:10px 14px;font-size:1.1rem;display:flex;align-items:center;justify-content:center;border-radius:10px}

.content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.head h2{font-size:1.25rem;font-weight:700;color:#fff}
.head span{color:var(--muted);font-size:.85rem}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative}
.card.on{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 2px var(--accent)}
.card.on::after{content:"\2713";position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#000;font-size:10px;font-weight:bold;display:grid;place-items:center}
.name{font-weight:600;font-size:0.9rem;color:#fff;padding-right:16px;line-height:1.2}
.sn{color:var(--muted);font-size:.72rem;font-family:monospace;word-break:break-all}
.ll{font-size:1.2rem;font-weight:800;margin-top:6px;color:var(--accent);line-height:1.25}
.usd{color:var(--muted);font-weight:500;font-size:.82rem;margin-top:1px}
.selbar .t{font-weight:700;font-size:1.05rem;color:var(--accent)}
.selbar .secondary-total{display:block;color:var(--muted);font-size:.78rem;font-weight:500}
.cat-tag{color:var(--muted);font-size:.7rem;margin-top:4px;background:var(--bg);padding:2px 6px;border-radius:4px;width:fit-content}
.acts{display:flex;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.acts button{flex:1;padding:6px 2px;font-weight:600;font-size:.75rem;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.acts .del{color:#f87171;border-color:rgba(239, 68, 68, 0.2)}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px}

.selbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line)}
.selbar .t{font-weight:700;font-size:1.05rem;color:var(--accent)}

/* Overlay & Scanner */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:2000;visibility:hidden;opacity:0;pointer-events:none;transition:all .15s;padding:16px}
.overlay.open{visibility:visible;opacity:1;pointer-events:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:400px;padding:20px;box-shadow:var(--shadow)}
.modal h3{font-size:1.15rem;margin-bottom:14px;color:#fff;font-weight:600}
.fg{margin-bottom:12px}.fg label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase}
.fg input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:1rem}
.m-act{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.zoom-controls{display:flex;gap:6px}
.zoom-btn{background:var(--card); color:var(--ink); border:1px solid var(--line); padding:6px 10px; border-radius:8px; font-size:0.8rem; font-weight:600}
.m-err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:6px}

#scanner-wrapper{width:100%; overflow:hidden; border-radius:12px; background:#000; border:1px solid var(--line); position:relative}
#interactive{width:100%; min-height:220px}
.flash-btn{position:absolute; top:10px; right:10px; z-index:10; background:rgba(0,0,0,0.6); color:#fff; border:1px solid var(--line); padding:6px 10px; border-radius:8px; font-size:0.85rem}

#scan{position:fixed;top:70px;left:50%;transform:translate(-50%,-10px);background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:16px 20px;width:90%;max-width:340px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.6);z-index:1500;opacity:0;visibility:hidden;pointer-events:none;transition:all .2s}
#scan.open{opacity:1;visibility:visible;transform:translate(-50%,0)}
#scan .sname{font-size:1.1rem;font-weight:600;color:#fff}
#scan .sll{font-size:2rem;font-weight:800;margin:2px 0 0;color:var(--accent)}
#scan .susd{color:var(--muted);font-size:.9rem;font-weight:500}
#scan .ssn{color:var(--muted);font-size:.78rem;font-family:monospace}

#toast{position:fixed;right:16px;bottom:16px;left:16px;background:var(--panel);border:1px solid var(--line);color:#fff;padding:12px 16px;border-radius:10px;display:flex;gap:10px;align-items:center;z-index:3000;opacity:0;visibility:hidden;pointer-events:none;transition:all .2s;text-align:center;justify-content:center}
#toast.show{opacity:1;visibility:visible}
#toast.err{border-color:var(--danger);background:#1a0c0c;color:#f87171}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Responsive Navigation Drawer */
.menu-btn{background:var(--panel); border:1px solid var(--line); color:#fff; padding:8px 12px; font-size:1.1rem; border-radius:8px; display:none}
.backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:15; display:none}

@media (max-width: 768px) {
  #login{grid-template-columns:1fr}
  .brand-pane{display:none}
  aside{position:absolute; left:0; top:0; bottom:0; transform:translateX(-100%); box-shadow:10px 0 30px rgba(0,0,0,0.8)}
  aside.mobile-open{transform:translateX(0)}
  .menu-btn{display:block}
  .backdrop.open{display:block}
}
</style>
</head>
<body>

<section id="login">
  <div class="brand-pane">
    <h1>Point of Sale</h1>
    <p>Look up prices, scan products, and manage system inventory seamlessly on mobile.</p>
  </div>
  <div class="role-pane">
    <div class="role-box">
      <h2>Sign in to POS</h2>
      <button class="role-btn" onclick="selectRole('Cashier')"><b>Cashier</b><span>Scan items and check prices</span></button>
      <button class="role-btn" onclick="selectRole('Admin')"><b>Admin</b><span>Manage inventory and pricing</span></button>
    </div>
  </div>
</section>

<div id="app" class="hidden">
  <div class="backdrop" id="drawer-backdrop"></div>
  <aside id="sidebar">
    <div class="logo">
      <span>POS System<small id="role-sub"></small></span>
      <button class="menu-btn" id="close-menu">&times;</button>
    </div>
    <div class="side-label">Categories</div>
    <div id="cats"></div>
    <div class="side-foot">
      <div id="admin-tools" class="hidden" style="display:grid;gap:8px">
        <button class="btn" id="add-cat">Add Category</button>
        <button class="btn" id="add-item">Add Product</button>
      </div>
      <button class="btn ghost" id="logout">Log Out</button>
    </div>
  </aside>
  <main>
    <div class="top">
      <button class="menu-btn" id="open-menu">☰</button>
      <div class="search">
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="q" type="text" placeholder="Scan or search..." autocomplete="off" spellcheck="false">
        </div>
        <button class="cam-btn" id="open-cam" title="Open Camera Scanner">📷</button>
      </div>
    </div>
    <div class="content">
      <div class="head"><h2 id="title">Products</h2><span id="count"></span></div>
      <div id="grid"></div>
    </div>
    <div class="selbar hidden" id="selbar">
      <span><b id="sel-n">0</b> selected</span>
      <span class="t num"><span id="sel-ll"></span><span class="secondary-total" id="sel-usd"></span></span>
      <div style="flex:1"></div>
      <button class="btn light" id="sel-clear" style="padding:6px 10px; font-size:0.8rem;">Clear</button>
    </div>
  </main>
</div>

<div id="scan"><div class="ssn" id="s-sn"></div><div class="sname" id="s-name"></div><div class="sll num" id="s-ll"></div><div class="susd num" id="s-usd"></div></div>

<!-- Camera Modal -->
<div class="overlay" id="cam-overlay">
  <div class="modal">
    <h3>Scan Barcode</h3>
    <div id="scanner-wrapper">
      <button class="flash-btn" id="flash-toggle" onclick="toggleFlash()">⚡ Flash</button>
      <div id="interactive"></div>
    </div>
    <div class="m-act">
      <div class="zoom-controls">
        <button class="zoom-btn" onclick="setZoom(1)">1x</button>
        <button class="zoom-btn" onclick="setZoom(2)">2x</button>
        <button class="zoom-btn" onclick="setZoom(3)">3x</button>
      </div>
      <button class="btn light" id="cam-close">Close</button>
    </div>
  </div>
</div>

<!-- Edit / Add Modal -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="m-title"></h3>
    <div id="m-body"></div>
    <div class="m-err" id="m-err"></div>
    <div class="m-act">
      <button class="btn light" id="m-cancel">Cancel</button>
      <button class="btn" id="m-save">Save</button>
    </div>
  </div>
</div>

<div id="toast"><span class="spin hidden" id="t-spin"></span><span id="t-text"></span></div>

<script>
// --- SUPABASE CONFIGURATION ---
const SUPABASE_URL = "https://kkmfhvuwanzugffmytlg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pYeJwa6OZPeKW8fI34I7bQ_WdUs5Bfb";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let store = { categories: [] }, admin = false, cat = 0, query = '', sel = new Set();
let scanT = null, toastT = null, html5QrcodeScanner = null, flashState = false, currentStreamTrack = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = n => '$' + (Number(n) || 0).toFixed(2);
const ll = n => 'L.L. ' + (Number(n) || 0).toLocaleString('en-US');

/* ---------- Data Loading from Supabase ---------- */
async function loadData() {
  try {
    showToast('Loading data...', false, true);
    
    const { data: catData, error: catErr } = await supabaseClient.from('categories').select('*');
    if (catErr) throw catErr;

    const { data: itemData, error: itemErr } = await supabaseClient.from('items').select('*');
    if (itemErr) throw itemErr;

    store.categories = (catData || []).map(c => ({
      id: c.id,
      name: c.name,
      items: (itemData || [])
        .filter(i => i.category_id === c.id)
        .map(i => ({
          serial: i.serial,
          name: i.name,
          priceUSD: Number(i.price_usd),
          priceLL: Number(i.price_ll)
        }))
    }));

    localStorage.setItem('pos_store_data', JSON.stringify(store));
    showToast('Loaded successfully!');
  } catch (e) {
    console.error(e);
    const local = localStorage.getItem('pos_store_data');
    if (local) {
      store = JSON.parse(local);
      showToast('Loaded from local storage (Offline)', true);
    } else {
      showToast('Failed to load data', true);
    }
  }
  render();
}

/* ---------- Login & Session Persistence ---------- */
function selectRole(r) {
  admin = r === 'Admin';
  localStorage.setItem('pos_user_role', r);
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');$('role-sub').textContent = r;
  $('admin-tools').classList.toggle('hidden', !admin);
  loadData();
  setTimeout(() => $('q').focus(), 50);
}

function logout() {
  localStorage.removeItem('pos_user_role');
  $('app').classList.add('hidden');$('login').classList.remove('hidden');
  sel.clear(); query = ''; $('q').value = '';
}

// Auto-login on page load if role exists
window.addEventListener('DOMContentLoaded', () => {
  const savedRole = localStorage.getItem('pos_user_role');
  if (savedRole) {
    selectRole(savedRole);
  }
});

/* ---------- Render ---------- */
function render() { renderCats(); renderItems(); renderSel(); }

function renderCats() {
  if (cat >= store.categories.length) cat = 0;
  $('cats').innerHTML = store.categories.map((c, i) => `
    <div class="cat ${i === cat && !query ? 'on' : ''}">
      <button class="cat-btn" data-i="${i}">${esc(c.name)}<i>${(c.items || []).length}</i></button>
      ${admin ? `<button class="cat-del" data-delcat="${i}" title="Delete">&times;</button>` : ''}
    </div>`).join('');
}

function visibleItems() {
  const q = query.toLowerCase();
  if (q) {
    const out = [];
    store.categories.forEach((c, ci) => (c.items || []).forEach(it => {
      if (it.name.toLowerCase().includes(q) || it.serial.toLowerCase().includes(q)) out.push({ it, ci });
    }));
    return out;
  }
  const c = store.categories[cat];
  return c ? (c.items || []).map(it => ({ it, ci: cat })) : [];
}

function renderItems() {
  const g = $('grid');
  if (!store.categories.length) {
    $('title').textContent = 'No categories';$('count').textContent = '';
    g.innerHTML = `<div class="empty"><h3>Inventory empty</h3><p>${admin ? 'Add a category to begin.' : ''}</p></div>`;
    return;
  }
  const list = visibleItems();
  $('title').textContent = query ? 'Results' : store.categories[cat].name;
  $('count').textContent = list.length + (list.length === 1 ? ' item' : ' items');
  if (!list.length) {
    g.innerHTML = `<div class="empty"><h3>No items found</h3><p>${query ? 'Check search term.' : ''}</p></div>`;
    return;
  }
  g.innerHTML = list.map(({ it, ci }) => `
    <article class="card ${sel.has(it.serial) ? 'on' : ''}" data-s="${esc(it.serial)}" data-c="${ci}">
      <div class="name">${esc(it.name)}</div>
      <div class="sn">${esc(it.serial)}</div>
      <div class="ll num">${ll(it.priceLL)}</div>
      <div class="usd num">${usd(it.priceUSD)}</div>
      ${query ? `<div class="cat-tag">${esc(store.categories[ci].name)}</div>` : ''}
      ${admin ? `<div class="acts"><button data-edit>Edit</button><button class="del" data-del>Del</button></div>` : ''}
    </article>`).join('');
}

function renderSel() {
  let u = 0, l = 0;
  store.categories.forEach(c => (c.items || []).forEach(it => {
    if (sel.has(it.serial)) {
      u += Number(it.priceUSD) || 0;
      l += Number(it.priceLL) || 0;
    }
  }));
  $('selbar').classList.toggle('hidden', !sel.size);
  $('sel-n').textContent = sel.size;
  $('sel-ll').textContent = ll(l);
  $('sel-usd').textContent = usd(u);
}

/* ---------- UI Helpers ---------- */
function showToast(text, isError = false, loading = false) {
  const t = $('toast');$('t-text').textContent = text;
  $('t-spin').classList.toggle('hidden', !loading);
  t.classList.toggle('err', !!isError);
  t.classList.add('show');
  clearTimeout(toastT);
  if (!loading) toastT = setTimeout(() => t.classList.remove('show'), 4000);
}

let onSave = null;
function openModal(title, html, save, label = 'Save', danger = false) {
  $('m-title').textContent = title;
  $('m-body').innerHTML = html;
  $('m-err').textContent = '';
  const b = $('m-save');
  b.textContent = label;
  b.className = 'btn' + (danger ? ' danger' : '');
  onSave = save;
  $('overlay').classList.add('open');
  setTimeout(() => { const f = $('m-body').querySelector('input'); (f || b).focus(); }, 30);
}

function closeModal() { $('overlay').classList.remove('open'); onSave = null; $('q').focus(); }

function submitModal() {
  if (!onSave) return;
  const err = onSave();
  if (err && typeof err === 'string') { $('m-err').textContent = err; }
}

function confirmBox(msg, fn) {
  openModal('Confirm', `<p style="color:var(--muted)">${esc(msg)}</p>`, () => { fn(); closeModal(); return ''; }, 'Delete', true);
}

function showScan(serial) {
  let found = null;
  store.categories.forEach(c => (c.items || []).forEach(it => {
    if (!found && it.serial.toLowerCase() === serial.toLowerCase()) found = it;
  }));
  $('s-sn').textContent = 'SN: ' + serial;
  $('s-name').textContent = found ? found.name : 'Not Found';
  $('s-ll').textContent = found ? ll(found.priceLL) : '';
  $('s-usd').textContent = found ? usd(found.priceUSD) : '';
  $('scan').classList.add('open');
  clearTimeout(scanT);
  scanT = setTimeout(() => $('scan').classList.remove('open'), 3000);
  return !!found;
}

/* ---------- Android Camera Scanner: capability-aware zoom and focus ---------- */
function getVideoTrack() {
  const v = document.querySelector('#interactive video');
  return v && v.srcObject ? v.srcObject.getVideoTracks()[0] : null;
}

async function applyCameraZoom(zoomLevel, showMessage = true) {
  const track = currentStreamTrack || getVideoTrack();
  if (!track || track.readyState !== 'live') {
    if (showMessage) showToast('Camera is still starting. Try again in a moment.', true);
    return false;
  }
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (!caps.zoom) {
      if (showMessage) showToast('Hardware zoom is not supported by this camera. Move the phone closer.', true);
      return false;
    }
    const min = Number(caps.zoom.min ?? 1);
    const max = Number(caps.zoom.max ?? 1);
    const step = Number(caps.zoom.step ?? 0.1);
    const requested = Math.min(Math.max(Number(zoomLevel), min), max);
    const z = step > 0 ? Math.round((requested - min) / step) * step + min : requested;
    await track.applyConstraints({ advanced: [{ zoom: Math.min(max, Math.max(min, z)) }] });
    if (showMessage) showToast('Camera zoom: ' + z.toFixed(1) + '×');
    return true;
  } catch (e) {
    console.warn('Camera zoom could not be applied:', e);
    if (showMessage) showToast('Zoom could not be applied on this Android camera.', true);
    return false;
  }
}

async function startCameraScanner() {
  $('cam-overlay').classList.add('open');
  flashState = false;
  $('flash-toggle').textContent = '⚡ Flash';
  if (!html5QrcodeScanner) html5QrcodeScanner = new Html5Qrcode('interactive', {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.QR_CODE
    ],
    verbose: false
  });
  if (html5QrcodeScanner.isScanning) return;

  try {
    await html5QrcodeScanner.start(
      { facingMode: { ideal: 'environment' } },
      { fps: 15, qrbox: (viewWidth, viewHeight) => {
          const width = Math.min(Math.floor(viewWidth * 0.88), 360);
          const height = Math.min(Math.floor(viewHeight * 0.42), 180);
          return { width, height };
        },
        aspectRatio: 1.333,
        videoConstraints: { facingMode: { ideal: 'environment' } }
      },
      decodedText => {
        stopCameraScanner();
        showScan(decodedText);
      },
      () => {}
    );

    currentStreamTrack = getVideoTrack();
    // Wait for Android to finish initializing the camera track before querying capabilities.
    setTimeout(async () => {
      const track = currentStreamTrack || getVideoTrack();
      if (!track || track.readyState !== 'live') return;
      try {
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        const advanced = [];
        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          advanced.push({ focusMode: 'continuous' });
        }
        if (advanced.length) await track.applyConstraints({ advanced });
        if (caps.zoom) {
          const min = Number(caps.zoom.min ?? 1);
          const max = Number(caps.zoom.max ?? min);
          // Start at a modest zoom, bounded to the device's actual supported range.
          const initialZoom = Math.min(max, Math.max(min, 2));
          await applyCameraZoom(initialZoom, false);
        }
      } catch (e) {
        console.warn('Optional camera focus/zoom setting unavailable:', e);
      }
    }, 900);
  } catch (err) {
    console.error('Camera startup failed:', err);
    showToast('Camera access failed. Allow camera permission and use HTTPS or localhost.', true);
    $('cam-overlay').classList.remove('open');
  }
}

async function setZoom(zoomLevel) {
  await applyCameraZoom(zoomLevel, true);
}

async function toggleFlash() {
  const track = currentStreamTrack || getVideoTrack();
  if (!track) return showToast('Camera stream not active', true);
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (!caps.torch) return showToast('Flashlight not supported by this camera', true);
  const next = !flashState;
  try {
    await track.applyConstraints({ advanced: [{ torch: next }] });
    flashState = next;
    $('flash-toggle').textContent = flashState ? '⚡ Flash (On)' : '⚡ Flash';
  } catch (e) {
    showToast('Flashlight could not be changed on this device', true);
  }
}

function stopCameraScanner() {
  const scanner = html5QrcodeScanner;
  currentStreamTrack = null;
  const close = () => {
    $('cam-overlay').classList.remove('open');
    flashState = false;
    $('flash-toggle').textContent = '⚡ Flash';
  };
  if (scanner && scanner.isScanning) {
    scanner.stop().then(close).catch(err => {
      console.warn('Could not stop scanner cleanly:', err);
      close();
    });
  } else close();
}

/* ---------- Admin Database Actions (Supabase) ---------- */
const field = (id, label, type = 'text', val = '', extra = '') =>
  `<div class="fg"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}" ${extra}></div>`;

async function addCategory() {
  openModal('New Category', field('f-name', 'Name'), async () => {
    const name = $('f-name').value.trim();
    if (!name) return 'Enter a category name.';
    const id = 'cat_' + Date.now();
    
    showToast('Saving...', false, true);
    const { error } = await supabaseClient.from('categories').insert([{ id, name }]);
    if (error) { showToast(error.message, true); return error.message; }

    store.categories.push({ id, name, items: [] });
    cat = store.categories.length - 1; query = ''; $('q').value = '';
    render(); closeModal(); showToast('Category added!');
  });
}

async function addItem() {
  if (!store.categories.length) return showToast('Create a category first.', true);
  openModal('Add Product',
    field('f-serial', 'Barcode / Serial') + field('f-name', 'Product Name') +
    field('f-usd', 'Price (USD)', 'number', '', 'step="0.01" min="0"') + field('f-ll', 'Price (L.L.)', 'number', '0', 'min="0"'), async () => {
    const serial = $('f-serial').value.trim(), name =$('f-name').value.trim();
    const price_usd = parseFloat($('f-usd').value), price_ll = parseFloat($('f-ll').value) || 0;
    if (!serial || !name || isNaN(price_usd)) return 'Fields required.';

    showToast('Saving...', false, true);
    const category_id = store.categories[cat].id;
    const { error } = await supabaseClient.from('items').insert([{ serial, category_id, name, price_usd, price_ll }]);
    if (error) { showToast(error.message, true); return error.message; }

    (store.categories[cat].items = store.categories[cat].items || []).push({ serial, name, priceUSD: price_usd, priceLL: price_ll });
    render(); closeModal(); showToast('Product added!');
  });
}

async function editItem(ci, serial) {
  const item = (store.categories[ci].items || []).find(i => i.serial === serial);
  if (!item) return;
  openModal('Edit Product',
    field('f-name', 'Name', 'text', item.name) +
    field('f-usd', 'Price (USD)', 'number', item.priceUSD, 'step="0.01" min="0"') +
    field('f-ll', 'Price (L.L.)', 'number', item.priceLL || 0, 'min="0"'), async () => {
    const name = $('f-name').value.trim(), price_usd = parseFloat($('f-usd').value), price_ll = parseFloat($('f-ll').value) || 0;
    if (!name || isNaN(price_usd)) return 'Fields required.';

    showToast('Updating...', false, true);
    const { error } = await supabaseClient.from('items').update({ name, price_usd, price_ll }).eq('serial', serial);
    if (error) { showToast(error.message, true); return error.message; }

    item.name = name; item.priceUSD = price_usd; item.priceLL = price_ll;
    render(); closeModal(); showToast('Product updated!');
  });
}

async function delItem(ci, serial) {
  confirmBox('Remove product?', async () => {
    showToast('Deleting...', false, true);
    await supabaseClient.from('items').delete().eq('serial', serial);
    const c = store.categories[ci];
    c.items = (c.items || []).filter(i => i.serial !== serial);
    sel.delete(serial);
    render(); showToast('Product deleted');
  });
}

async function delCat(i) {
  confirmBox(`Delete category and all its items?`, async () => {
    showToast('Deleting...', false, true);
    const catId = store.categories[i].id;
    await supabaseClient.from('categories').delete().eq('id', catId);
    store.categories.splice(i, 1); cat = 0;
    render(); showToast('Category deleted');
  });
}

/* ---------- Event Listeners ---------- */
$('logout').addEventListener('click', logout);$('add-cat').addEventListener('click', addCategory);
$('add-item').addEventListener('click', addItem);$('m-cancel').addEventListener('click', closeModal);
$('m-save').addEventListener('click', submitModal);$('overlay').addEventListener('mousedown', e => { if (e.target === $('overlay')) closeModal(); });$('sel-clear').addEventListener('click', () => { sel.clear(); renderItems(); renderSel(); });

const closeDrawer = () => {
  $('sidebar').classList.remove('mobile-open');$('drawer-backdrop').classList.remove('open');
};
$('open-menu').addEventListener('click', () => {
  $('sidebar').classList.add('mobile-open');$('drawer-backdrop').classList.add('open');
});
$('close-menu').addEventListener('click', closeDrawer);$('drawer-backdrop').addEventListener('click', closeDrawer);

$('open-cam').addEventListener('click', startCameraScanner);$('cam-close').addEventListener('click', stopCameraScanner);

$('cats').addEventListener('click', e => {
  const d = e.target.closest('[data-delcat]');
  if (d) return delCat(+d.dataset.delcat);
  const b = e.target.closest('[data-i]');
  if (b) { 
    cat = +b.dataset.i; query = ''; $('q').value = ''; render(); 
    closeDrawer();
  }
});

function toggle(serial) { sel.has(serial) ? sel.delete(serial) : sel.add(serial); renderItems(); renderSel(); }
$('grid').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const s = card.dataset.s, ci = +card.dataset.c;
  if (e.target.closest('[data-edit]')) return editItem(ci, s);
  if (e.target.closest('[data-del]')) return delItem(ci, s);
  toggle(s);
});

const q = $('q');
q.addEventListener('input', () => { query = q.value.trim(); render(); });
q.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const v = q.value.trim(); if (!v) return;
  showScan(v);
  if (v) { q.value = ''; query = ''; render(); }
});
</script>
