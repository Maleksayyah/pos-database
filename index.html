<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional POS System - Dark Theme</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-sidebar: #090d16;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; cursor: default; pointer-events: auto !important; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; user-select: none; }

        /* Login Screen View */
        #login-view { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-main); }
        .login-card { background: var(--bg-card); padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 340px; text-align: center; border: 1px solid var(--border); }
        .login-card h2 { margin-bottom: 20px; color: var(--text-main); }
        .login-btn { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; color: white; transition: opacity 0.2s; }
        .login-btn:hover { opacity: 0.9; }
        .btn-cashier { background: #0284c7; }
        .btn-admin { background: #16a34a; }

        /* POS Dashboard View */
        #pos-view { display: none; height: 100vh; display: flex; }
        .sidebar { width: 280px; background-color: var(--bg-sidebar); color: var(--text-main); display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--border); z-index: 10; }
        .sidebar-header { padding: 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); }
        .sidebar-header h3 { font-size: 1.1rem; text-transform: uppercase; color: var(--text-muted); }
        .sidebar-header h2 { font-size: 1.3rem; margin-top: 5px; color: var(--text-main); }
        
        .category-list { padding: 15px; overflow-y: auto; flex: 1; }
        .category-item { display: flex; align-items: center; background: rgba(255,255,255,0.02); margin-bottom: 8px; border-radius: 6px; overflow: hidden; border: 1px solid transparent; cursor: pointer; transition: background 0.2s; }
        .category-item:hover { background: rgba(255,255,255,0.05); }
        .category-item.active { background: var(--accent); color: #0f172a; }
        .category-item.active .category-btn { color: #0f172a; font-weight: 700; }
        .category-btn { flex: 1; padding: 12px 15px; background: transparent; color: var(--text-main); border: none; text-align: left; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
        .delete-cat-btn { background: transparent; border: none; color: #f87171; padding: 10px 12px; cursor: pointer; font-size: 1rem; }

        .sidebar-footer { padding: 15px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--border); }
        .admin-btn { background: var(--success); width: 100%; padding: 11px; margin-bottom: 8px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
        .btn-logout { background: #475569; }

        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg-main); }
        .top-bar { padding: 15px 25px; background: var(--bg-card); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        
        .search-box { position: relative; width: 400px; }
        .search-box input { width: 100%; padding: 10px 15px 10px 38px; font-size: 0.95rem; border: 1px solid var(--border); border-radius: 6px; outline: none; background: var(--bg-main); color: var(--text-main); cursor: text; }
        .search-box input:focus { border-color: var(--accent); }
        .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: var(--text-muted); }

        .user-badge { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; background: var(--bg-main); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); font-weight: 500; }
        .user-badge span { color: var(--accent); font-weight: 700; }

        .content-area { flex: 1; padding: 25px; overflow-y: auto; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-header h2 { font-size: 1.4rem; color: var(--text-main); }
        .item-count { font-size: 0.9rem; color: var(--text-muted); background: var(--bg-card); padding: 4px 10px; border-radius: 12px; font-weight: 600; border: 1px solid var(--border); }

        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
        .item-card { background: var(--bg-card); padding: 18px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .item-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3); }
        
        .item-select-checkbox { position: absolute; top: 12px; right: 12px; width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }
        .item-info h4 { font-size: 1.05rem; color: var(--text-main); margin-bottom: 6px; font-weight: 600; padding-right: 20px; }
        .item-serial { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; display: inline-block; background: var(--bg-main); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
        
        .price-container { margin-top: 5px; margin-bottom: 12px; border-top: 1px dashed var(--border); padding-top: 10px; }
        .price-usd { font-size: 1.2rem; font-weight: 700; color: #f87171; }
        .price-ll { font-size: 0.9rem; font-weight: 600; color: #4ade80; margin-top: 2px; }

        .action-row { display: flex; gap: 8px; margin-top: auto; }
        .btn-action { flex: 1; padding: 7px 10px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 0.85rem; color: white; }
        .btn-edit { background: #0284c7; }
        .btn-delete { background: #dc2626; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); background: var(--bg-card); border-radius: 10px; border: 1px dashed var(--border); }

        /* Sync Toast Indicator */
        #sync-toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg-card); color: var(--text-main); padding: 12px 20px; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; z-index: 1000; transform: translateY(100px); opacity: 0; transition: all 0.3s ease; }
        #sync-toast.show { transform: translateY(0); opacity: 1; }
        .spinner { width: 16px; height: 16px; border: 2px solid var(--text-muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modal Overlays */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: var(--bg-card); border: 1px solid var(--border); width: 400px; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; background: var(--bg-main); color: var(--text-main); cursor: text; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .modal-btn { padding: 9px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
        .modal-btn-cancel { background: #475569; color: white; }
        .modal-btn-save { background: var(--accent); color: #0f172a; }
    </style>
</head>
<body>

    <!-- Sync Indicator Toast -->
    <div id='sync-toast'>
        <div class='spinner'></div>
        <span id='sync-text'>Syncing with GitHub...</span>
    </div>

    <!-- Scan Result Popup Modal (Auto-closes in 3s) -->
    <div class='modal-overlay' id='scan-overlay'>
        <div class='modal-card' style='text-align: center;'>
            <h3 style='color: var(--accent); margin-bottom: 5px;'>Scanned Product</h3>
            <div id='scan-serial-badge' style='font-size: 0.85rem; color: var(--text-muted); background: var(--bg-main); display: inline-block; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border); margin-bottom: 15px;'>SN: ---</div>
            
            <div style='background: var(--bg-main); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px;'>
                <div id='scan-item-name' style='font-size: 1.2rem; font-weight: bold; color: var(--text-main); margin-bottom: 8px;'>Searching...</div>
                <div id='scan-item-usd' style='font-size: 1.6rem; font-weight: bold; color: var(--danger);'>$0.00</div>
                <div id='scan-item-ll' style='font-size: 1.1rem; font-weight: 600; color: var(--success); margin-top: 4px;'>L.L. 0</div>
            </div>

            <div style='color: var(--text-muted); font-size: 0.8rem;'>Closing automatically in 3 seconds...</div>
        </div>
    </div>

    <!-- 1. LOGIN VIEW -->
    <div id='login-view'>
        <div class='login-card'>
            <h2>POS Login</h2>
            <button class='login-btn btn-cashier' onclick='selectRole("Cashier")'>Login as Cashier</button>
            <button class='login-btn btn-admin' onclick='selectRole("Admin")'>Login as Admin</button>
        </div>
    </div>

    <!-- 2. POS DASHBOARD VIEW -->
    <div id='pos-view' style='display: none;'>
        <div class='sidebar'>
            <div>
                <div class='sidebar-header'>
                    <h3 id='sidebar-role-title'>POS System</h3>
                    <h2 id='sidebar-category-heading'>Categories</h2>
                </div>
                <div class='category-list' id='category-list'></div>
            </div>
            <div class='sidebar-footer'>
                <div id='admin-section'></div>
                <button class='admin-btn btn-logout' onclick='logout()'>Logout Session</button>
            </div>
        </div>

        <div class='main'>
            <div class='top-bar'>
                <div class='search-box'>
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type='text' id='scanner-input' placeholder='Scan Barcode or Search Items...' />
                </div>
                <div class='user-badge' id='role-display'>Role: Cashier</div>
            </div>

            <div class='content-area'>
                <div class='section-header'>
                    <h2 id='current-category-name'>Select a Category</h2>
                    <span class='item-count' id='item-count-badge'>0 items</span>
                </div>
                <div id='items-container' class='items-grid'></div>
            </div>
        </div>
    </div>

    <!-- Action Modal Dialog -->
    <div class='modal-overlay' id='modal-overlay'>
        <div class='modal-card'>
            <h3 id='modal-title'>Modal Title</h3>
            <div id='modal-body'></div>
            <div class='modal-actions'>
                <button class='modal-btn modal-btn-cancel' onclick='closeModal()'>Cancel</button>
                <button class='modal-btn modal-btn-save' id='modal-save-btn'>Save</button>
            </div>
        </div>
    </div>

    <script>
        let storeData = { categories: [] };
        let currentRole = "";
        let isAdmin = false;
        let currentCatIndex = 0;
        let searchQuery = '';
        let selectedSerials = new Set();
        let scanTimer = null;

        async function loadStoreData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/maleksayyah/pos-database/main/data.json?t=' + Date.now());
                const data = await response.json();
                if(data && data.categories) {
                    storeData = data;
                }
                renderCategories();
            } catch (err) {
                console.error('Failed to load data.json', err);
                renderCategories();
            }
        }

        function selectRole(role) {
            currentRole = role;
            isAdmin = (role === 'Admin');
            
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('pos-view').style.display = 'flex';

            document.getElementById('sidebar-role-title').innerText = `POS Portal (${role})`;
            document.getElementById('role-display').innerHTML = `Active Role: <span>${role}</span>`;

            if(isAdmin) {
                document.getElementById('admin-section').innerHTML = `
                    <button class='admin-btn' onclick='openAddCategoryModal()'>Add Category</button>
                    <button class='admin-btn' style='background: #d97706;' onclick='openAddItemModal()'>Add Item</button>
                `;
            }
            loadStoreData();
        }

        function logout() {
            document.getElementById('pos-view').style.display = 'none';
            document.getElementById('login-view').style.display = 'flex';
        }

        function showToast(text, isError = false) {
            const toast = document.getElementById('sync-toast');
            document.getElementById('sync-text').innerText = text;
            toast.style.borderColor = isError ? '#ef4444' : '#334155';
            toast.classList.add('show');
            if(!isError) {
                setTimeout(() => toast.classList.remove('show'), 3000);
            }
        }

        function showScanResult(serial) {
            document.getElementById('scan-serial-badge').innerText = 'SN: ' + serial;
            
            let foundItem = null;
            if (storeData && storeData.categories) {
                for (let cat of storeData.categories) {
                    if (cat.items) {
                        let match = cat.items.find(i => i.serial.toLowerCase() === serial.toLowerCase());
                        if (match) {
                            foundItem = match;
                            break;
                        }
                    }
                }
            }

            if (foundItem) {
                document.getElementById('scan-item-name').innerText = foundItem.name;
                document.getElementById('scan-item-usd').innerText = '$' + parseFloat(foundItem.priceUSD).toFixed(2);
                document.getElementById('scan-item-ll').innerText = (foundItem.priceLL && foundItem.priceLL > 0) 
                    ? 'L.L. ' + Number(foundItem.priceLL).toLocaleString() 
                    : 'L.L. 0';
            } else {
                document.getElementById('scan-item-name').innerText = 'Item Not Found';
                document.getElementById('scan-item-usd').innerText = '---';
                document.getElementById('scan-item-ll').innerText = '---';
            }

            const overlay = document.getElementById('scan-overlay');
            overlay.classList.add('active');

            if (scanTimer) clearTimeout(scanTimer);
            scanTimer = setTimeout(() => {
                overlay.classList.remove('active');
            }, 3000);
        }

        function renderCategories() {
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            if(!storeData.categories) storeData.categories = [];
            
            storeData.categories.forEach((cat, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = `category-item ${index === currentCatIndex ? 'active' : ''}`;
                
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.innerText = cat.name;
                btn.onclick = () => { currentCatIndex = index; searchQuery = ''; renderCategories(); };
                wrapper.appendChild(btn);

                if(isAdmin) {
                    const delCat = document.createElement('button');
                    delCat.className = 'delete-cat-btn';
                    delCat.innerHTML = '🗑';
                    delCat.onclick = (e) => { e.stopPropagation(); deleteCategory(index); };
                    wrapper.appendChild(delCat);
                }
                list.appendChild(wrapper);
            });

            if(storeData.categories.length > 0) {
                if(currentCatIndex >= storeData.categories.length) currentCatIndex = 0;
                renderItems();
            } else {
                document.getElementById('current-category-name').innerText = "No Categories Available";
                document.getElementById('item-count-badge').innerText = "0 items";
                document.getElementById('items-container').innerHTML = `<div class='empty-state'><h3>No Inventory Found</h3><p>Create a category to start.</p></div>`;
            }
        }

        function renderItems() {
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            if(storeData.categories.length === 0) return;

            const cat = storeData.categories[currentCatIndex];
            document.getElementById('current-category-name').innerText = cat.name;
            
            const items = cat.items || [];
            const filteredItems = items.filter(item => 
                item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                item.serial.toLowerCase().includes(searchQuery.toLowerCase())
            );

            document.getElementById('item-count-badge').innerText = `${filteredItems.length} item${filteredItems.length === 1 ? '' : 's'}`;

            if(filteredItems.length === 0) {
                container.innerHTML = `<div class='empty-state'><h3>No Products Found</h3><p>No items match your search.</p></div>`;
                return;
            }

            filteredItems.forEach((item) => {
                const itemIndex = items.findIndex(i => i.serial === item.serial);
                const isSelected = selectedSerials.has(item.serial);
                
                const card = document.createElement('div');
                card.className = `item-card ${isSelected ? 'selected' : ''}`;
                
                let priceHTML = `<div class='price-usd'>$${item.priceUSD.toFixed(2)}</div>`;
                if(item.priceLL && item.priceLL > 0) {
                    priceHTML += `<div class='price-ll'>L.L. ${item.priceLL.toLocaleString()}</div>`;
                }
                
                let adminControls = isAdmin ? `
                    <div class='action-row'>
                        <button class='btn-action btn-edit' onclick='openEditItemModal(${currentCatIndex}, ${itemIndex})'>Edit</button>
                        <button class='btn-action btn-delete' onclick='deleteItem(${currentCatIndex}, ${itemIndex})'>Delete</button>
                    </div>` : '';

                card.innerHTML = `
                    <input type='checkbox' class='item-select-checkbox' ${isSelected ? 'checked' : ''} onchange='toggleSelectItem("${item.serial}")' />
                    <div class='item-info' onclick='toggleSelectItem("${item.serial}")' style='cursor: pointer;'>
                        <h4>${item.name}</h4>
                        <span class='item-serial'>SN: ${item.serial}</span>
                        <div class='price-container'>${priceHTML}</div>
                    </div>
                    ${adminControls}
                `;
                container.appendChild(card);
            });
        }

        function toggleSelectItem(serial) {
            if(selectedSerials.has(serial)) {
                selectedSerials.delete(serial);
            } else {
                selectedSerials.add(serial);
            }
            renderItems();
        }

        const modalOverlay = document.getElementById('modal-overlay');
        function showModal(title, bodyHTML, onSave) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHTML;
            document.getElementById('modal-save-btn').onclick = () => { if(onSave()) closeModal(); };
            modalOverlay.classList.add('active');
        }
        function closeModal() { modalOverlay.classList.remove('active'); }

        function openAddCategoryModal() {
            showModal('Add New Category', `<div class='form-group'><label>Name</label><input type='text' id='modal-cat-name' autofocus /></div>`, () => {
                const name = document.getElementById('modal-cat-name').value.trim();
                if(name) { 
                    storeData.categories.push({ id: 'cat_' + Date.now(), name, items: [] }); 
                    currentCatIndex = storeData.categories.length - 1; 
                    syncToGitHub(); 
                    return true; 
                }
                return false;
            });
        }

        function openAddItemModal() {
            showModal('Add Product', `<div class='form-group'><label>Serial</label><input type='text' id='modal-serial' autofocus /></div><div class='form-group'><label>Name</label><input type='text' id='modal-name' /></div><div class='form-group'><label>USD ($)</label><input type='number' step='0.01' id='modal-usd' /></div><div class='form-group'><label>L.L.</label><input type='number' id='modal-ll' value='0' /></div>`, () => {
                const serial = document.getElementById('modal-serial').value.trim();
                const name = document.getElementById('modal-name').value.trim();
                const priceUSD = parseFloat(document.getElementById('modal-usd').value);
                const priceLL = parseFloat(document.getElementById('modal-ll').value) || 0;
                if(serial && name && !isNaN(priceUSD)) {
                    if(!storeData.categories[currentCatIndex].items) storeData.categories[currentCatIndex].items = [];
                    storeData.categories[currentCatIndex].items.push({ serial, name, priceUSD, priceLL });
                    syncToGitHub(); 
                    return true;
                }
                return false;
            });
        }

        function openEditItemModal(catIndex, itemIndex) {
            const item = storeData.categories[catIndex].items[itemIndex];
            showModal('Edit Product', `<div class='form-group'><label>Name</label><input type='text' id='edit-name' value='${item.name}' /></div><div class='form-group'><label>USD ($)</label><input type='number' step='0.01' id='edit-usd' value='${item.priceUSD}' /></div><div class='form-group'><label>L.L.</label><input type='number' id='edit-ll' value='${item.priceLL || 0}' /></div>`, () => {
                item.name = document.getElementById('edit-name').value.trim();
                item.priceUSD = parseFloat(document.getElementById('edit-usd').value);
                item.priceLL = parseFloat(document.getElementById('edit-ll').value) || 0;
                syncToGitHub(); 
                return true;
            });
        }

        function deleteCategory(catIndex) {
            if(confirm('Delete category?')) { 
                storeData.categories.splice(catIndex, 1); 
                currentCatIndex = 0; 
                syncToGitHub(); 
            }
        }

        function deleteItem(catIndex, itemIndex) {
            if(confirm('Delete item?')) { 
                storeData.categories[catIndex].items.splice(itemIndex, 1); 
                syncToGitHub(); 
            }
        }

        function syncToGitHub() {
            showToast('Syncing changes with GitHub...');
            renderCategories();
            
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects && window.chrome.webview.hostObjects.nativeBridge) {
                window.chrome.webview.hostObjects.nativeBridge.PostMessage('SAVE_JSON:' + JSON.stringify(storeData, null, 2));
            }
        }

        const input = document.getElementById('scanner-input');
        input.addEventListener('input', (e) => { searchQuery = e.target.value.trim(); renderItems(); });
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const val = input.value.trim();
                if(val) {
                    showScanResult(val);
                    input.value = ''; 
                    searchQuery = ''; 
                    renderItems();
                }
            }
        });
    </script>
</body>
</html>
