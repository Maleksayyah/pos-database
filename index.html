<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS System</title>
<style>
:root{--ink:#1b2430;--muted:#6b7686;--line:#e2e6ec;--bg:#f3f5f8;--card:#fff;--side:#16202e;--side2:#223047;--accent:#0f766e;--soft:#e0f2f0;--danger:#b42318;--ok:#067647;--warn:#b54708}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:8px}
input{font:inherit;user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* Login */
#login{display:grid;grid-template-columns:1fr 1fr;height:100%}
.brand-pane{background:var(--side);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.brand-pane h1{font-size:2.2rem;font-weight:600;letter-spacing:-.02em;max-width:12ch;line-height:1.15}
.brand-pane p{color:#9fb0c6;max-width:34ch}
.role-pane{display:flex;flex-direction:column;justify-content:center;padding:56px;gap:14px;max-width:460px}
.role-pane h2{font-size:1.5rem;margin-bottom:6px}
.role-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:18px 20px;background:var(--card);border:1px solid var(--line);text-align:left;border-radius:12px;transition:border-color .15s,box-shadow .15s}
.role-btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.role-btn b{font-size:1.05rem}.role-btn span{color:var(--muted);font-size:.9rem}

/* App shell */
#app{display:grid;grid-template-columns:260px 1fr;height:100%}
aside{background:var(--side);color:#dbe4f0;display:flex;flex-direction:column;min-height:0}
.logo{padding:22px 20px 14px;font-size:1.15rem;font-weight:600;color:#fff}
.logo small{display:block;color:#8ea0b8;font-weight:400;font-size:.8rem}
.side-label{padding:10px 20px 6px;color:#8ea0b8;font-size:.8rem}
#cats{flex:1;overflow-y:auto;padding:0 10px}
.cat{display:flex;align-items:center;border-radius:8px;margin-bottom:2px;color:inherit}
.cat:hover{background:var(--side2)}
.cat.on{background:var(--soft);color:#0b4f4a}
.cat-btn{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:none;color:inherit;text-align:left;font-weight:500}
.cat-btn i{font-style:normal;font-size:.8rem;opacity:.75}
.cat-del{background:none;color:#f19a92;padding:8px 10px;font-size:.85rem}
.cat.on .cat-del{color:var(--danger)}
.side-foot{padding:14px;border-top:1px solid var(--side2);display:grid;gap:8px}
.btn{padding:10px 14px;font-weight:600;background:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--side2);color:#dbe4f0}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}

main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:14px;align-items:center;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.search input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--danger)}
.spacer{flex:1}

.content{flex:1;overflow-y:auto;padding:24px}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.head h2{font-size:1.4rem;font-weight:600}
.head span{color:var(--muted)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative}
.card:hover{border-color:#c4ccd8}
.card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.card.on::after{content:"\2713";position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;display:grid;place-items:center}
.name{font-weight:600;font-size:1rem;padding-right:26px}
.sn{color:var(--muted);font-size:.82rem}
.usd{font-size:1.45rem;font-weight:700;margin-top:10px}
.ll{color:var(--ok);font-weight:600;font-size:.92rem}
.cat-tag{color:var(--muted);font-size:.78rem;margin-top:4px}
.acts{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.acts button{flex:1;padding:7px;font-weight:600;font-size:.85rem;background:var(--bg);color:var(--ink)}
.acts .del{color:var(--danger)}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.empty h3{color:var(--ink);margin-bottom:4px}

.selbar{display:flex;align-items:center;gap:18px;padding:12px 24px;background:var(--ink);color:#fff}
.selbar .t{font-weight:700;font-size:1.05rem}

/* Overlays: hidden ones never intercept clicks */
.overlay{position:fixed;inset:0;background:rgba(15,23,35,.55);display:grid;place-items:center;z-index:100;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .15s}
.overlay.open{visibility:visible;opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:14px;width:min(420px,92vw);padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{font-size:1.15rem;margin-bottom:14px}
.fg{margin-bottom:12px}.fg label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.fg input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.fg input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.m-act{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.m-err{color:var(--danger);font-size:.85rem;min-height:1.2em}

#scan{position:fixed;top:78px;left:50%;transform:translate(-50%,-12px);background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 28px;min-width:340px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.22);z-index:90;opacity:0;visibility:hidden;pointer-events:none;transition:all .2s}
#scan.open{opacity:1;visibility:visible;transform:translate(-50%,0)}
#scan .sname{font-size:1.15rem;font-weight:600}
#scan .susd{font-size:2.2rem;font-weight:700;margin:4px 0 0}
#scan .sll{color:var(--ok);font-weight:600}
#scan .ssn{color:var(--muted);font-size:.82rem}

#toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;display:flex;gap:10px;align-items:center;z-index:200;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1;visibility:visible}
#toast.err{background:var(--danger)}
.spin{width:14px;height:14px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:1ms!important}}
@media (max-width:800px){#login{grid-template-columns:1fr}.brand-pane{display:none}#app{grid-template-columns:200px 1fr}}
</style>
</head>
<body>

<section id="login">
  <div class="brand-pane">
    <h1>Point of sale</h1>
    <p>Look up prices, scan products and manage inventory in one place.</p>
  </div>
  <div class="role-pane">
    <h2>Sign in as</h2>
    <button class="role-btn" data-role="Cashier"><b>Cashier</b><span>Scan items and check prices</span></button>
    <button class="role-btn" data-role="Admin"><b>Admin</b><span>Also add, edit and delete inventory</span></button>
  </div>
</section>

<div id="app" class="hidden">
  <aside>
    <div class="logo">POS System<small id="role-sub"></small></div>
    <div class="side-label">Categories</div>
    <div id="cats"></div>
    <div class="side-foot">
      <div id="admin-tools" class="hidden" style="display:grid;gap:8px">
        <button class="btn" id="add-cat">Add category</button>
        <button class="btn" id="add-item">Add product</button>
      </div>
      <button class="btn ghost" id="logout">Log out</button>
    </div>
  </aside>
  <main>
    <div class="top">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="Scan a barcode or search by name or serial" autocomplete="off" spellcheck="false">
      </div>
      <span class="spacer"></span>
      <span class="chip"><span class="dot" id="dot"></span><span id="status">Loading</span></span>
      <span class="chip">Role <b id="role-chip"></b></span>
      <span class="chip num" id="clock"></span>
    </div>
    <div class="content">
      <div class="head"><h2 id="title">Products</h2><span id="count"></span></div>
      <div id="grid"></div>
    </div>
    <div class="selbar hidden" id="selbar">
      <span><b id="sel-n">0</b> selected</span>
      <span class="t num" id="sel-usd"></span>
      <span class="num" id="sel-ll"></span>
      <span class="spacer"></span>
      <button class="btn light" id="sel-clear">Clear selection</button>
    </div>
  </main>
</div>

<div id="scan"><div class="ssn" id="s-sn"></div><div class="sname" id="s-name"></div><div class="susd num" id="s-usd"></div><div class="sll num" id="s-ll"></div></div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="m-title"></h3>
    <div id="m-body"></div>
    <div class="m-err" id="m-err"></div>
    <div class="m-act">
      <button class="btn light" id="m-cancel">Cancel</button>
      <button class="btn" id="m-save">Save</button>
    </div>
  </div>
</div>

<div id="toast"><span class="spin hidden" id="t-spin"></span><span id="t-text"></span></div>

<script>
let store = { categories: [] }, admin = false, cat = 0, query = '', sel = new Set();
let scanT = null, toastT = null, onSave = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = n => '$' + (Number(n) || 0).toFixed(2);
const ll = n => 'L.L. ' + (Number(n) || 0).toLocaleString('en-US');
const modalOpen = () => $('overlay').classList.contains('open');

/* ---------- data ---------- */
async function loadData() {
  try {
    const r = await fetch('https://raw.githubusercontent.com/maleksayyah/pos-database/main/data.json?t=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (d && Array.isArray(d.categories)) store = d;
    setStatus(true, 'Inventory loaded');
  } catch (e) {
    setStatus(false, 'Offline: could not load inventory');
  }
  render();
}
function setStatus(ok, text) { $('dot').className = 'dot ' + (ok ? 'ok' : 'bad'); $('status').textContent = text; }

function hostPost(msg) {
  const w = window.chrome && window.chrome.webview;
  if (!w) return false;
  try {
    if (typeof w.postMessage === 'function') { w.postMessage(msg); return true; }
    if (w.hostObjects && w.hostObjects.nativeBridge) { w.hostObjects.nativeBridge.PostMessage(msg); return true; }
  } catch (e) {}
  return false;
}
function sync() {
  render();
  showToast('Saving changes...', false, true);
  if (!hostPost('SAVE_JSON:' + JSON.stringify(store, null, 2)))
    showToast('Changes not saved. Open this page in the POS app to sync.', true);
}

/* ---------- login ---------- */
function selectRole(r) {
  admin = r === 'Admin';
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('role-chip').textContent = r;
  $('role-sub').textContent = r + ' session';
  $('admin-tools').classList.toggle('hidden', !admin);
  loadData();
  setTimeout(() => $('q').focus(), 50);
}
function logout() {
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  sel.clear(); query = ''; $('q').value = '';
}

/* ---------- render ---------- */
function render() { renderCats(); renderItems(); renderSel(); }

function renderCats() {
  if (cat >= store.categories.length) cat = 0;
  $('cats').innerHTML = store.categories.map((c, i) => `
    <div class="cat ${i === cat && !query ? 'on' : ''}">
      <button class="cat-btn" data-i="${i}">${esc(c.name)}<i>${(c.items || []).length}</i></button>
      ${admin ? `<button class="cat-del" data-delcat="${i}" title="Delete category" aria-label="Delete category ${esc(c.name)}">Delete</button>` : ''}
    </div>`).join('');
}

function visibleItems() {
  const q = query.toLowerCase();
  if (q) {
    const out = [];
    store.categories.forEach((c, ci) => (c.items || []).forEach(it => {
      if (it.name.toLowerCase().includes(q) || it.serial.toLowerCase().includes(q)) out.push({ it, ci });
    }));
    return out;
  }
  const c = store.categories[cat];
  return c ? (c.items || []).map(it => ({ it, ci: cat })) : [];
}

function renderItems() {
  const g = $('grid');
  if (!store.categories.length) {
    $('title').textContent = 'No categories yet';
    $('count').textContent = '';
    g.innerHTML = `<div class="empty"><h3>Your inventory is empty</h3><p>${admin ? 'Add a category to get started.' : 'Ask an admin to add categories.'}</p></div>`;
    return;
  }
  const list = visibleItems();
  $('title').textContent = query ? 'Search results' : store.categories[cat].name;
  $('count').textContent = list.length + (list.length === 1 ? ' product' : ' products');
  if (!list.length) {
    g.innerHTML = `<div class="empty"><h3>${query ? 'No products match your search' : 'No products in this category'}</h3><p>${query ? 'Check the spelling or scan the barcode again.' : (admin ? 'Use Add product to create one.' : '')}</p></div>`;
    return;
  }
  g.innerHTML = list.map(({ it, ci }) => `
    <article class="card ${sel.has(it.serial) ? 'on' : ''}" data-s="${esc(it.serial)}" data-c="${ci}" tabindex="0" role="button" aria-pressed="${sel.has(it.serial)}">
      <div class="name">${esc(it.name)}</div>
      <div class="sn">SN ${esc(it.serial)}</div>
      <div class="usd num">${usd(it.priceUSD)}</div>
      ${it.priceLL > 0 ? `<div class="ll num">${ll(it.priceLL)}</div>` : ''}
      ${query ? `<div class="cat-tag">${esc(store.categories[ci].name)}</div>` : ''}
      ${admin ? `<div class="acts"><button data-edit>Edit</button><button class="del" data-del>Delete</button></div>` : ''}
    </article>`).join('');
}

function renderSel() {
  let u = 0, l = 0;
  store.categories.forEach(c => (c.items || []).forEach(it => {
    if (sel.has(it.serial)) { u += Number(it.priceUSD) || 0; l += Number(it.priceLL) || 0; }
  }));
  $('selbar').classList.toggle('hidden', !sel.size);
  $('sel-n').textContent = sel.size;
  $('sel-usd').textContent = usd(u);
  $('sel-ll').textContent = l > 0 ? ll(l) : '';
}

/* ---------- ui helpers ---------- */
function showToast(text, isError = false, loading = false) {
  const t = $('toast');
  $('t-text').textContent = text;
  $('t-spin').classList.toggle('hidden', !loading);
  t.classList.toggle('err', !!isError);
  t.classList.add('show');
  clearTimeout(toastT);
  if (!loading) toastT = setTimeout(() => t.classList.remove('show'), isError ? 6000 : 3000);
}

function openModal(title, html, save, label = 'Save', danger = false) {
  $('m-title').textContent = title;
  $('m-body').innerHTML = html;
  $('m-err').textContent = '';
  const b = $('m-save');
  b.textContent = label;
  b.className = 'btn' + (danger ? ' danger' : '');
  onSave = save;
  $('overlay').classList.add('open');
  setTimeout(() => { const f = $('m-body').querySelector('input'); (f || b).focus(); }, 30);
}
function closeModal() { $('overlay').classList.remove('open'); onSave = null; $('q').focus(); }
function submitModal() {
  if (!onSave) return;
  const err = onSave();
  if (err) $('m-err').textContent = err; else closeModal();
}
function confirmBox(msg, fn) {
  openModal('Please confirm', `<p>${esc(msg)}</p>`, () => { fn(); return ''; }, 'Delete', true);
}

function showScan(serial) {
  let found = null;
  store.categories.forEach(c => (c.items || []).forEach(it => {
    if (!found && it.serial.toLowerCase() === serial.toLowerCase()) found = it;
  }));
  $('s-sn').textContent = 'SN ' + serial;
  $('s-name').textContent = found ? found.name : 'Product not found';
  $('s-usd').textContent = found ? usd(found.priceUSD) : '';
  $('s-ll').textContent = found && found.priceLL > 0 ? ll(found.priceLL) : '';
  $('scan').classList.add('open');
  clearTimeout(scanT);
  scanT = setTimeout(() => $('scan').classList.remove('open'), 4000);
  return !!found;
}

/* ---------- admin actions ---------- */
const field = (id, label, type = 'text', val = '', extra = '') =>
  `<div class="fg"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}" ${extra}></div>`;

function addCategory() {
  openModal('Add category', field('f-name', 'Category name'), () => {
    const name = $('f-name').value.trim();
    if (!name) return 'Enter a category name.';
    store.categories.push({ id: 'cat_' + Date.now(), name, items: [] });
    cat = store.categories.length - 1; query = ''; $('q').value = '';
    sync(); return '';
  });
}
function addItem() {
  if (!store.categories.length) return showToast('Add a category first.', true);
  openModal('Add product to ' + store.categories[cat].name,
    field('f-serial', 'Serial / barcode') + field('f-name', 'Name') +
    field('f-usd', 'Price (USD)', 'number', '', 'step="0.01" min="0"') + field('f-ll', 'Price (L.L.)', 'number', '0', 'min="0"'), () => {
    const serial = $('f-serial').value.trim(), name = $('f-name').value.trim();
    const p = parseFloat($('f-usd').value), l = parseFloat($('f-ll').value) || 0;
    if (!serial || !name || isNaN(p)) return 'Serial, name and USD price are required.';
    const dup = store.categories.some(c => (c.items || []).some(i => i.serial.toLowerCase() === serial.toLowerCase()));
    if (dup) return 'That serial already exists.';
    const c = store.categories[cat];
    (c.items = c.items || []).push({ serial, name, priceUSD: p, priceLL: l });
    sync(); return '';
  });
}
function editItem(ci, serial) {
  const item = (store.categories[ci].items || []).find(i => i.serial === serial);
  if (!item) return;
  openModal('Edit product',
    field('f-name', 'Name', 'text', item.name) +
    field('f-usd', 'Price (USD)', 'number', item.priceUSD, 'step="0.01" min="0"') +
    field('f-ll', 'Price (L.L.)', 'number', item.priceLL || 0, 'min="0"'), () => {
    const name = $('f-name').value.trim(), p = parseFloat($('f-usd').value);
    if (!name || isNaN(p)) return 'Name and USD price are required.';
    item.name = name; item.priceUSD = p; item.priceLL = parseFloat($('f-ll').value) || 0;
    sync(); return '';
  });
}
function delItem(ci, serial) {
  confirmBox('Delete this product? This cannot be undone.', () => {
    const c = store.categories[ci];
    c.items = (c.items || []).filter(i => i.serial !== serial);
    sel.delete(serial); sync();
  });
}
function delCat(i) {
  confirmBox(`Delete "${store.categories[i].name}" and all its products?`, () => {
    store.categories.splice(i, 1); cat = 0; sync();
  });
}

/* ---------- events ---------- */
document.querySelectorAll('.role-btn').forEach(b => b.addEventListener('click', () => selectRole(b.dataset.role)));
$('logout').addEventListener('click', logout);
$('add-cat').addEventListener('click', addCategory);
$('add-item').addEventListener('click', addItem);
$('m-cancel').addEventListener('click', closeModal);
$('m-save').addEventListener('click', submitModal);
$('overlay').addEventListener('mousedown', e => { if (e.target === $('overlay')) closeModal(); });
$('sel-clear').addEventListener('click', () => { sel.clear(); renderItems(); renderSel(); });

$('cats').addEventListener('click', e => {
  const d = e.target.closest('[data-delcat]');
  if (d) return delCat(+d.dataset.delcat);
  const b = e.target.closest('[data-i]');
  if (b) { cat = +b.dataset.i; query = ''; $('q').value = ''; render(); }
});

function toggle(serial) { sel.has(serial) ? sel.delete(serial) : sel.add(serial); renderItems(); renderSel(); }
$('grid').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const s = card.dataset.s, ci = +card.dataset.c;
  if (e.target.closest('[data-edit]')) return editItem(ci, s);
  if (e.target.closest('[data-del]')) return delItem(ci, s);
  toggle(s);
});
$('grid').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) { e.preventDefault(); toggle(e.target.dataset.s); }
});

const q = $('q');
q.addEventListener('input', () => { query = q.value.trim(); render(); });
q.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const v = q.value.trim(); if (!v) return;
  const hit = showScan(v);
  if (hit) { q.value = ''; query = ''; render(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (modalOpen()) closeModal(); else $('scan').classList.remove('open'); return; }
  if (e.key === 'Enter' && modalOpen() && e.target.tagName !== 'BUTTON') { e.preventDefault(); submitModal(); return; }
  /* Barcode scanners type like a keyboard: send stray keystrokes to the search box */
  if (!$('app').classList.contains('hidden') && !modalOpen() && e.target.tagName !== 'INPUT' &&
      e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey && e.key !== ' ') q.focus();
});

function tick() { $('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
tick(); setInterval(tick, 30000);
</script>
</body>
