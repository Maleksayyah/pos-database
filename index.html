<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System</title>
    <style>
        :root {
            --primary: #2c3e50;
            --primary-light: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #7f8c8d;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; }

        /* Login Screen View */
        #login-view { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f6f9; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 340px; text-align: center; }
        .login-card h2 { margin-bottom: 20px; color: var(--primary); }
        .login-btn { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; color: white; }
        .btn-cashier { background: #3498db; }
        .btn-admin { background: #2ecc71; }

        /* POS Dashboard View */
        #pos-view { display: none; height: 100vh; display: flex; }
        .sidebar { width: 280px; background-color: var(--primary); color: white; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 4px 0 10px rgba(0,0,0,0.05); z-index: 10; }
        .sidebar-header { padding: 20px; background: rgba(0,0,0,0.1); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header h3 { font-size: 1.1rem; text-transform: uppercase; color: #cbd5e1; }
        .sidebar-header h2 { font-size: 1.3rem; margin-top: 5px; color: #fff; }
        
        .category-list { padding: 15px; overflow-y: auto; flex: 1; }
        .category-item { display: flex; align-items: center; background: rgba(255,255,255,0.03); margin-bottom: 8px; border-radius: 6px; overflow: hidden; border: 1px solid transparent; }
        .category-item.active { background: var(--accent); }
        .category-btn { flex: 1; padding: 12px 15px; background: transparent; color: white; border: none; text-align: left; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
        .delete-cat-btn { background: transparent; border: none; color: #ff8787; padding: 10px 12px; cursor: pointer; font-size: 1rem; }

        .sidebar-footer { padding: 15px; background: rgba(0,0,0,0.15); border-top: 1px solid rgba(255,255,255,0.05); }
        .admin-btn { background: var(--success); width: 100%; padding: 11px; margin-bottom: 8px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
        .btn-logout { background: #64748b; }

        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { padding: 15px 25px; background: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        
        .search-box { position: relative; width: 400px; }
        .search-box input { width: 100%; padding: 10px 15px 10px 38px; font-size: 0.95rem; border: 1px solid var(--border); border-radius: 6px; outline: none; background: #f8fafc; }
        .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: var(--text-muted); }

        .user-badge { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; background: #f1f5f9; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); font-weight: 500; }
        .user-badge span { color: var(--accent); font-weight: 700; }

        .content-area { flex: 1; padding: 25px; overflow-y: auto; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-header h2 { font-size: 1.4rem; color: var(--primary); }
        .item-count { font-size: 0.9rem; color: var(--text-muted); background: #e2e8f0; padding: 4px 10px; border-radius: 12px; font-weight: 600; }

        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
        .item-card { background: var(--card-bg); padding: 18px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; }
        .item-info h4 { font-size: 1.05rem; color: var(--primary); margin-bottom: 6px; font-weight: 600; }
        .item-serial { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; display: inline-block; background: #f8fafc; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
        
        .price-container { margin-top: 5px; margin-bottom: 12px; border-top: 1px dashed var(--border); padding-top: 10px; }
        .price-usd { font-size: 1.2rem; font-weight: 700; color: var(--danger); }
        .price-ll { font-size: 0.9rem; font-weight: 600; color: var(--success); margin-top: 2px; }

        .action-row { display: flex; gap: 8px; margin-top: auto; }
        .btn-action { flex: 1; padding: 7px 10px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 0.85rem; color: white; }
        .btn-edit { background: #38bdf8; }
        .btn-delete { background: #f87171; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); background: white; border-radius: 10px; border: 1px dashed var(--border); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: white; width: 400px; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--primary-light); }
        .form-group input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .modal-btn { padding: 9px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
        .modal-btn-cancel { background: #e2e8f0; color: var(--text-main); }
        .modal-btn-save { background: var(--accent); color: white; }
    </style>
</head>
<body>

    <div id='login-view'>
        <div class='login-card'>
            <h2>POS Login</h2>
            <button class='login-btn btn-cashier' onclick='selectRole("Cashier")'>Login as Cashier</button>
            <button class='login-btn btn-admin' onclick='selectRole("Admin")'>Login as Admin</button>
        </div>
    </div>

    <div id='pos-view' style='display: none;'>
        <div class='sidebar'>
            <div>
                <div class='sidebar-header'>
                    <h3 id='sidebar-role-title'>POS System</h3>
                    <h2 id='sidebar-category-heading'>Categories</h2>
                </div>
                <div class='category-list' id='category-list'></div>
            </div>
            <div class='sidebar-footer'>
                <div id='admin-section'></div>
                <button class='admin-btn btn-logout' onclick='logout()'>Logout Session</button>
            </div>
        </div>

        <div class='main'>
            <div class='top-bar'>
                <div class='search-box'>
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type='text' id='scanner-input' placeholder='Scan Barcode or Search Items...' />
                </div>
                <div class='user-badge' id='role-display'>Role: Cashier</div>
            </div>

            <div class='content-area'>
                <div class='section-header'>
                    <h2 id='current-category-name'>Select a Category</h2>
                    <span class='item-count' id='item-count-badge'>0 items</span>
                </div>
                <div id='items-container' class='items-grid'></div>
            </div>
        </div>
    </div>

    <div class='modal-overlay' id='modal-overlay'>
        <div class='modal-card'>
            <h3 id='modal-title'>Modal Title</h3>
            <div id='modal-body'></div>
            <div class='modal-actions'>
                <button class='modal-btn modal-btn-cancel' onclick='closeModal()'>Cancel</button>
                <button class='modal-btn modal-btn-save' id='modal-save-btn'>Save</button>
            </div>
        </div>
    </div>

    <script>
        let storeData = { categories: [] };
        let currentRole = "";
        let isAdmin = false;
        let currentCatIndex = 0;
        let searchQuery = '';

        // Fetch data.json directly from GitHub raw link automatically
        async function loadStoreData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/maleksayyah/pos-database/main/data.json?t=' + Date.now());
                storeData = await response.json();
                renderCategories();
            } catch (err) {
                console.error('Failed to load data.json', err);
            }
        }

        function selectRole(role) {
            currentRole = role;
            isAdmin = (role === 'Admin');
            
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('pos-view').style.display = 'flex';

            document.getElementById('sidebar-role-title').innerText = `POS Portal (${role})`;
            document.getElementById('role-display').innerHTML = `Active Role: <span>${role}</span>`;

            if(isAdmin) {
                document.getElementById('admin-section').innerHTML = `
                    <button class='admin-btn' onclick='openAddCategoryModal()'>Add Category</button>
                    <button class='admin-btn' style='background: #e67e22;' onclick='openAddItemModal()'>Add Item</button>
                `;
            }
            loadStoreData();
        }

        function logout() {
            document.getElementById('pos-view').style.display = 'none';
            document.getElementById('login-view').style.display = 'flex';
        }

        function renderCategories() {
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            if(!storeData.categories) storeData.categories = [];
            
            storeData.categories.forEach((cat, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = `category-item ${index === currentCatIndex ? 'active' : ''}`;
                
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.innerText = cat.name;
                btn.onclick = () => { currentCatIndex = index; searchQuery = ''; renderCategories(); };
                wrapper.appendChild(btn);

                if(isAdmin) {
                    const delCat = document.createElement('button');
                    delCat.className = 'delete-cat-btn';
                    delCat.innerHTML = '🗑';
                    delCat.onclick = (e) => { e.stopPropagation(); deleteCategory(index); };
                    wrapper.appendChild(delCat);
                }
                list.appendChild(wrapper);
            });

            if(storeData.categories.length > 0) {
                if(currentCatIndex >= storeData.categories.length) currentCatIndex = 0;
                renderItems();
            } else {
                document.getElementById('current-category-name').innerText = "No Categories Available";
                document.getElementById('item-count-badge').innerText = "0 items";
                document.getElementById('items-container').innerHTML = `<div class='empty-state'><h3>No Inventory Found</h3><p>Create a category to start.</p></div>`;
            }
        }

        function renderItems() {
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            if(storeData.categories.length === 0) return;

            const cat = storeData.categories[currentCatIndex];
            document.getElementById('current-category-name').innerText = cat.name;
            
            const items = cat.items || [];
            const filteredItems = items.filter(item => 
                item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                item.serial.toLowerCase().includes(searchQuery.toLowerCase())
            );

            document.getElementById('item-count-badge').innerText = `${filteredItems.length} item${filteredItems.length === 1 ? '' : 's'}`;

            if(filteredItems.length === 0) {
                container.innerHTML = `<div class='empty-state'><h3>No Products Found</h3><p>No items match your search.</p></div>`;
                return;
            }

            filteredItems.forEach((item) => {
                const itemIndex = items.findIndex(i => i.serial === item.serial);
                const card = document.createElement('div');
                card.className = 'item-card';
                
                let priceHTML = `<div class='price-usd'>$${item.priceUSD.toFixed(2)}</div>`;
                if(item.priceLL && item.priceLL > 0) {
                    priceHTML += `<div class='price-ll'>L.L. ${item.priceLL.toLocaleString()}</div>`;
                }
                
                let adminControls = isAdmin ? `
                    <div class='action-row'>
                        <button class='btn-action btn-edit' onclick='openEditItemModal(${currentCatIndex}, ${itemIndex})'>Edit</button>
                        <button class='btn-action btn-delete' onclick='deleteItem(${currentCatIndex}, ${itemIndex})'>Delete</button>
                    </div>` : '';

                card.innerHTML = `
                    <div class='item-info'>
                        <h4>${item.name}</h4>
                        <span class='item-serial'>SN: ${item.serial}</span>
                        <div class='price-container'>${priceHTML}</div>
                    </div>
                    ${adminControls}
                `;
                container.appendChild(card);
            });
        }

        const modalOverlay = document.getElementById('modal-overlay');
        function showModal(title, bodyHTML, onSave) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHTML;
            document.getElementById('modal-save-btn').onclick = () => { if(onSave()) closeModal(); };
            modalOverlay.classList.add('active');
        }
        function closeModal() { modalOverlay.classList.remove('active'); }

        function openAddCategoryModal() {
            showModal('Add New Category', `<div class='form-group'><label>Name</label><input type='text' id='modal-cat-name' autofocus /></div>`, () => {
                const name = document.getElementById('modal-cat-name').value.trim();
                if(name) { storeData.categories.push({ id: 'cat_' + Date.now(), name, items: [] }); currentCatIndex = storeData.categories.length - 1; syncToGitHub(); return true; }
                return false;
            });
        }

        function openAddItemModal() {
            showModal('Add Product', `<div class='form-group'><label>Serial</label><input type='text' id='modal-serial' autofocus /></div><div class='form-group'><label>Name</label><input type='text' id='modal-name' /></div><div class='form-group'><label>USD ($)</label><input type='number' step='0.01' id='modal-usd' /></div><div class='form-group'><label>L.L.</label><input type='number' id='modal-ll' value='0' /></div>`, () => {
                const serial = document.getElementById('modal-serial').value.trim();
                const name = document.getElementById('modal-name').value.trim();
                const priceUSD = parseFloat(document.getElementById('modal-usd').value);
                const priceLL = parseFloat(document.getElementById('modal-ll').value) || 0;
                if(serial && name && !isNaN(priceUSD)) {
                    if(!storeData.categories[currentCatIndex].items) storeData.categories[currentCatIndex].items = [];
                    storeData.categories[currentCatIndex].items.push({ serial, name, priceUSD, priceLL });
                    syncToGitHub(); return true;
                }
                return false;
            });
        }

        function openEditItemModal(catIndex, itemIndex) {
            const item = storeData.categories[catIndex].items[itemIndex];
            showModal('Edit Product', `<div class='form-group'><label>Name</label><input type='text' id='edit-name' value='${item.name}' /></div><div class='form-group'><label>USD ($)</label><input type='number' step='0.01' id='edit-usd' value='${item.priceUSD}' /></div><div class='form-group'><label>L.L.</label><input type='number' id='edit-ll' value='${item.priceLL || 0}' /></div>`, () => {
                item.name = document.getElementById('edit-name').value.trim();
                item.priceUSD = parseFloat(document.getElementById('edit-usd').value);
                item.priceLL = parseFloat(document.getElementById('edit-ll').value) || 0;
                syncToGitHub(); return true;
            });
        }

        function deleteCategory(catIndex) {
            if(confirm('Delete category?')) { storeData.categories.splice(catIndex, 1); currentCatIndex = 0; syncToGitHub(); }
        }

        function deleteItem(catIndex, itemIndex) {
            if(confirm('Delete item?')) { storeData.categories[catIndex].items.splice(itemIndex, 1); syncToGitHub(); }
        }

        function syncToGitHub() {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects && window.chrome.webview.hostObjects.nativeBridge) {
                window.chrome.webview.hostObjects.nativeBridge.PostMessage('SAVE_JSON:' + JSON.stringify(storeData, null, 2));
            }
        }

        const input = document.getElementById('scanner-input');
        input.addEventListener('input', (e) => { searchQuery = e.target.value.trim(); renderItems(); });
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const val = input.value.trim();
                if(val && window.chrome?.webview?.hostObjects?.nativeBridge) {
                    window.chrome.webview.hostObjects.nativeBridge.PostMessage('SCAN:' + val);
                    input.value = ''; searchQuery = ''; renderItems();
                }
            }
        });
    </script>
</body>
</html>
