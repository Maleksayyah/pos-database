<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>POS System</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090d16;--panel:#111827;--card:#1f2937;--side:#0d131f;--side2:#1e293b;--line:#2d3748;--ink:#f3f4f6;--muted:#9ca3af;--accent:#10b981;--soft:rgba(16,185,129,.15);--danger:#ef4444;--shadow:0 10px 25px -5px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100svh}
body{font:15px/1.5 "Inter",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;transition:all .15s ease}
input{font:inherit;user-select:text;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* Login */
#login{position:fixed;inset:0;z-index:1000;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);height:100%}
.brand-pane{background:linear-gradient(135deg,#0f172a,#060911);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line)}
.brand-pane h1{font-size:2.2rem;font-weight:700;line-height:1.15;background:linear-gradient(to right,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand-pane p{color:#94a3b8;max-width:36ch}
.role-pane{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;background:var(--bg)}
.role-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.role-pane h2{font-size:1.5rem;font-weight:600;margin-bottom:4px;color:#fff}
.role-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px 20px;background:var(--panel);border:1px solid var(--line);text-align:left;border-radius:12px;color:var(--ink);width:100%}
.role-btn:active{transform:scale(.98)}
.role-btn b{font-size:1.1rem;color:#fff}
.role-btn span{color:var(--muted);font-size:.85rem}
.role-btn.scan{background:var(--soft);border-color:var(--accent)}
.role-btn.scan b{color:var(--accent)}

/* App shell */
#app{display:flex;width:100vw;height:100svh;position:relative;overflow:hidden}
aside{width:260px;min-width:260px;background:var(--side);color:#e2e8f0;display:flex;flex-direction:column;height:100%;border-right:1px solid var(--line);z-index:20;transition:transform .25s ease}
.logo{padding:18px 16px 12px;font-size:1.1rem;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;align-items:center}
.logo small{display:block;color:var(--accent);font-weight:500;font-size:.7rem;margin-top:2px;text-transform:uppercase}
.side-label{padding:12px 16px 6px;color:var(--muted);font-size:.75rem;text-transform:uppercase;font-weight:600}
#cats{flex:1;overflow-y:auto;padding:0 8px;-webkit-overflow-scrolling:touch}
.cat{display:flex;align-items:center;border-radius:8px;margin-bottom:4px;color:var(--muted)}
.cat.on{background:var(--soft);color:var(--accent);font-weight:600}
.cat-btn{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:none;color:inherit;text-align:left;font-size:.95rem}
.cat-btn i{font-style:normal;font-size:.75rem;background:rgba(255,255,255,.08);padding:2px 8px;border-radius:12px;color:var(--ink)}
.cat.on .cat-btn i{background:var(--accent);color:#000;font-weight:700}
.cat-del{background:none;color:#f87171;padding:10px 12px;font-size:1.1rem}
.side-foot{padding:12px;border-top:1px solid var(--line);display:grid;gap:8px;background:var(--side)}
.btn{padding:12px 16px;font-weight:600;background:var(--accent);color:#051d14;border-radius:10px;font-size:.95rem}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--side2);color:var(--ink);border:1px solid var(--line)}
.btn.light{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;background:var(--bg)}
.top{display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.search{flex:1;display:flex;gap:8px;align-items:center}
.search-input-wrap{position:relative;flex:1}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:#fff;font-size:.95rem}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.cam-btn{background:var(--accent);color:#051d14;padding:10px 14px;font-size:1.1rem;display:flex;align-items:center;justify-content:center;border-radius:10px}
.content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.head h2{font-size:1.25rem;font-weight:700;color:#fff}
.head span{color:var(--muted);font-size:.85rem}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative}
.card.on{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 2px var(--accent)}
.card.on::after{content:"\2713";position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#000;font-size:10px;font-weight:bold;display:grid;place-items:center}
.name{font-weight:600;font-size:.9rem;color:#fff;padding-right:16px;line-height:1.2}
.sn{color:var(--muted);font-size:.72rem;font-family:monospace;word-break:break-all}
.ll{font-size:1.2rem;font-weight:800;margin-top:6px;color:var(--accent);line-height:1.25}
.usd{color:var(--muted);font-weight:500;font-size:.82rem;margin-top:1px}
.selbar .secondary-total{display:block;color:var(--muted);font-size:.78rem;font-weight:500}
.cat-tag{color:var(--muted);font-size:.7rem;margin-top:4px;background:var(--bg);padding:2px 6px;border-radius:4px;width:fit-content}
.acts{display:flex;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.acts button{flex:1;padding:6px 2px;font-weight:600;font-size:.75rem;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.acts .del{color:#f87171;border-color:rgba(239,68,68,.2)}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
.selbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line)}
.selbar .t{font-weight:700;font-size:1.05rem;color:var(--accent)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:2000;visibility:hidden;opacity:0;pointer-events:none;transition:all .15s;padding:16px}
.overlay.open{visibility:visible;opacity:1;pointer-events:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:400px;padding:20px;box-shadow:var(--shadow)}
.modal h3{font-size:1.15rem;margin-bottom:14px;color:#fff;font-weight:600}
.fg{margin-bottom:12px}.fg label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase}
.fg input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:1rem}
.m-act{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.m-err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:6px}

#scan{position:fixed;top:70px;left:50%;transform:translate(-50%,-10px);background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:16px 20px;width:90%;max-width:340px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.6);z-index:1500;opacity:0;visibility:hidden;pointer-events:none;transition:all .2s}
#scan.open{opacity:1;visibility:visible;transform:translate(-50%,0)}
#scan .sname{font-size:1.1rem;font-weight:600;color:#fff}
#scan .sll{font-size:2rem;font-weight:800;margin:2px 0 0;color:var(--accent)}
#scan .susd{color:var(--muted);font-size:.9rem;font-weight:500}
#scan .ssn{color:var(--muted);font-size:.78rem;font-family:monospace}

#toast{position:fixed;right:16px;bottom:16px;left:16px;background:var(--panel);border:1px solid var(--line);color:#fff;padding:12px 16px;border-radius:10px;display:flex;gap:10px;align-items:center;z-index:3000;opacity:0;visibility:hidden;pointer-events:none;transition:all .2s;text-align:center;justify-content:center}
#toast.show{opacity:1;visibility:visible}
#toast.err{border-color:var(--danger);background:#1a0c0c;color:#f87171}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.menu-btn{background:var(--panel);border:1px solid var(--line);color:#fff;padding:8px 12px;font-size:1.1rem;border-radius:8px;display:none}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:15;display:none}

/* ===== Full-screen portrait scanner page ===== */
#scanpage{position:fixed;inset:0;z-index:1800;background:#000;display:none;overflow:hidden;touch-action:none}
#scanpage.open{display:block}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.frame{position:absolute;left:50%;top:36%;width:80%;max-width:360px;aspect-ratio:1.5;transform:translate(-50%,-50%);border-radius:20px;border:2px solid var(--accent);box-shadow:0 0 0 100vmax rgba(0,0,0,.5);pointer-events:none;overflow:hidden}
.frame::after{content:"";position:absolute;left:8%;right:8%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:ln 2s ease-in-out infinite}
@keyframes ln{0%,100%{top:12%}50%{top:88%}}
.sc-top{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;z-index:5}
.sc-top .sc-title{color:#fff;font-weight:600;text-shadow:0 1px 4px #000}
.circ{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:1.2rem;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;padding:0}
.circ.on{background:var(--accent);color:#000}
.sc-bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:12px;z-index:5;background:linear-gradient(transparent,rgba(0,0,0,.75) 30%)}
#res{background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:14px 16px;text-align:center;display:none;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#res.show{display:block}
#res.nf{border-color:var(--danger)}
#res .rsn{color:var(--muted);font-size:.78rem;font-family:monospace;word-break:break-all}
#res .rname{font-size:1.15rem;font-weight:600;color:#fff}
#res .rll{font-size:2.1rem;font-weight:800;color:var(--accent);line-height:1.2}
#res.nf .rname{color:#f87171}
#res .rusd{color:var(--muted);font-size:1rem}
.zoom-row{display:flex;align-items:center;gap:10px}
.zoom-row input[type=range]{flex:1;accent-color:var(--accent);height:28px}
.zb{background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:18px;font-size:.85rem;font-weight:600;min-width:44px}
.zb.on{background:var(--accent);color:#000;border-color:var(--accent)}
#zlabel{color:#fff;font-weight:700;min-width:44px;text-align:center;text-shadow:0 1px 4px #000}
#hq{display:none}

@media (max-width:768px){
  #login{grid-template-columns:1fr}
  .brand-pane{display:none}
  aside{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:10px 0 30px rgba(0,0,0,.8)}
  aside.mobile-open{transform:translateX(0)}
  .menu-btn{display:block}
  .backdrop.open{display:block}
}
</style>
</head>
<body>

<section id="login">
  <div class="brand-pane">
    <h1>Point of Sale</h1>
    <p>Look up prices, scan products, and manage system inventory seamlessly on mobile.</p>
  </div>
  <div class="role-pane">
    <div class="role-box">
      <h2>Sign in to POS</h2>
      <button class="role-btn scan" onclick="startScanMode()"><b>📷 Scan Item</b><span>Open camera instantly and see the price</span></button>
      <button class="role-btn" onclick="selectRole('Cashier')"><b>Cashier</b><span>Scan items and check prices</span></button>
      <button class="role-btn" onclick="selectRole('Admin')"><b>Admin</b><span>Manage inventory and pricing</span></button>
    </div>
  </div>
</section>

<div id="app" class="hidden">
  <div class="backdrop" id="drawer-backdrop"></div>
  <aside id="sidebar">
    <div class="logo">
      <span>POS System<small id="role-sub"></small></span>
      <button class="menu-btn" id="close-menu">&times;</button>
    </div>
    <div class="side-label">Categories</div>
    <div id="cats"></div>
    <div class="side-foot">
      <div id="admin-tools" class="hidden" style="display:grid;gap:8px">
        <button class="btn" id="add-cat">Add Category</button>
        <button class="btn" id="add-item">Add Product</button>
      </div>
      <button class="btn ghost" id="logout">Log Out</button>
    </div>
  </aside>
  <main>
    <div class="top">
      <button class="menu-btn" id="open-menu">☰</button>
      <div class="search">
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="q" type="text" placeholder="Scan or search..." autocomplete="off" spellcheck="false">
        </div>
        <button class="cam-btn" id="open-cam" title="Open Camera Scanner">📷</button>
      </div>
    </div>
    <div class="content">
      <div class="head"><h2 id="title">Products</h2><span id="count"></span></div>
      <div id="grid"></div>
    </div>
    <div class="selbar hidden" id="selbar">
      <span><b id="sel-n">0</b> selected</span>
      <span class="t num"><span id="sel-ll"></span><span class="secondary-total" id="sel-usd"></span></span>
      <div style="flex:1"></div>
      <button class="btn light" id="sel-clear" style="padding:6px 10px;font-size:.8rem">Clear</button>
    </div>
  </main>
</div>

<div id="scan"><div class="ssn" id="s-sn"></div><div class="sname" id="s-name"></div><div class="sll num" id="s-ll"></div><div class="susd num" id="s-usd"></div></div>

<!-- Full-screen scanner page -->
<div id="scanpage">
  <video id="vid" playsinline muted autoplay></video>
  <div class="frame"></div>
  <div id="sc-status" style="position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:4;color:#fff;text-align:center;font-weight:600;text-shadow:0 1px 6px #000;display:none"></div>
  <div class="sc-top">
    <button class="circ" id="sc-back" aria-label="Back">←</button>
    <span class="sc-title" id="sc-title">Scan Item</span>
    <div style="display:flex;gap:8px">
      <button class="circ" id="sc-flash" aria-label="Flash" title="Flash">⚡</button>
    </div>
  </div>
  <div class="sc-bottom">
    <div id="res"><div class="rsn" id="r-sn"></div><div class="rname" id="r-name"></div><div class="rll num" id="r-ll"></div><div class="rusd num" id="r-usd"></div></div>
    <div class="zoom-row" id="zoom-row">
      <button class="zb" data-z="1">1x</button>
      <button class="zb" data-z="2">2x</button>
      <button class="zb" data-z="3">3x</button>
      <input type="range" id="zslider" min="1" max="5" step="0.1" value="1">
      <span id="zlabel">1.0×</span>
    </div>
  </div>
  <div id="hq"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="m-title"></h3>
    <div id="m-body"></div>
    <div class="m-err" id="m-err"></div>
    <div class="m-act">
      <button class="btn light" id="m-cancel">Cancel</button>
      <button class="btn" id="m-save">Save</button>
    </div>
  </div>
</div>

<div id="toast"><span class="spin hidden" id="t-spin"></span><span id="t-text"></span></div>

<script>
const SUPABASE_URL = "https://kkmfhvuwanzugffmytlg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pYeJwa6OZPeKW8fI34I7bQ_WdUs5Bfb";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let store = { categories: [] }, admin = false, cat = 0, query = '', sel = new Set();
let scanT = null, toastT = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = n => '$' + (Number(n) || 0).toFixed(2);
const ll = n => 'L.L. ' + (Number(n) || 0).toLocaleString('en-US');

/* ---------- Data ---------- */
async function loadData() {
  try {
    showToast('Loading data...', false, true);
    const { data: catData, error: catErr } = await supabaseClient.from('categories').select('*');
    if (catErr) throw catErr;
    const { data: itemData, error: itemErr } = await supabaseClient.from('items').select('*');
    if (itemErr) throw itemErr;
    store.categories = (catData || []).map(c => ({
      id: c.id, name: c.name,
      items: (itemData || []).filter(i => i.category_id === c.id)
        .map(i => ({ serial: i.serial, name: i.name, priceUSD: Number(i.price_usd), priceLL: Number(i.price_ll) }))
    }));
    localStorage.setItem('pos_store_data', JSON.stringify(store));
    showToast('Loaded successfully!');
  } catch (e) {
    console.error(e);
    const local = localStorage.getItem('pos_store_data');
    if (local) { store = JSON.parse(local); showToast('Loaded from local storage (Offline)', true); }
    else showToast('Failed to load data', true);
  }
  render();
}

/* ---------- Login ---------- */
function selectRole(r) {
  admin = r === 'Admin';
  localStorage.setItem('pos_user_role', r);
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden'); $('role-sub').textContent = r;
  $('admin-tools').classList.toggle('hidden', !admin);
  loadData();
  setTimeout(() => $('q').focus(), 50);
}
async function startScanMode() {
  admin = false;
  openScanner('login');          // camera opens immediately
  loadData();                    // prices load in the background
}
function logout() {
  localStorage.removeItem('pos_user_role');
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  sel.clear(); query = ''; $('q').value = '';
}
window.addEventListener('DOMContentLoaded', () => {
  const savedRole = localStorage.getItem('pos_user_role');
  if (savedRole) selectRole(savedRole);
});

/* ---------- Render ---------- */
function render() { renderCats(); renderItems(); renderSel(); }
function renderCats() {
  if (cat >= store.categories.length) cat = 0;
  $('cats').innerHTML = store.categories.map((c, i) => `
    <div class="cat ${i === cat && !query ? 'on' : ''}">
      <button class="cat-btn" data-i="${i}">${esc(c.name)}<i>${(c.items || []).length}</i></button>
      ${admin ? `<button class="cat-del" data-delcat="${i}" title="Delete">&times;</button>` : ''}
    </div>`).join('');
}
function visibleItems() {
  const q = query.toLowerCase();
  if (q) {
    const out = [];
    store.categories.forEach((c, ci) => (c.items || []).forEach(it => {
      if (it.name.toLowerCase().includes(q) || it.serial.toLowerCase().includes(q)) out.push({ it, ci });
    }));
    return out;
  }
  const c = store.categories[cat];
  return c ? (c.items || []).map(it => ({ it, ci: cat })) : [];
}
function renderItems() {
  const g = $('grid');
  if (!store.categories.length) {
    $('title').textContent = 'No categories'; $('count').textContent = '';
    g.innerHTML = `<div class="empty"><h3>Inventory empty</h3><p>${admin ? 'Add a category to begin.' : ''}</p></div>`;
    return;
  }
  const list = visibleItems();
  $('title').textContent = query ? 'Results' : store.categories[cat].name;
  $('count').textContent = list.length + (list.length === 1 ? ' item' : ' items');
  if (!list.length) {
    g.innerHTML = `<div class="empty"><h3>No items found</h3><p>${query ? 'Check search term.' : ''}</p></div>`;
    return;
  }
  g.innerHTML = list.map(({ it, ci }) => `
    <article class="card ${sel.has(it.serial) ? 'on' : ''}" data-s="${esc(it.serial)}" data-c="${ci}">
      <div class="name">${esc(it.name)}</div>
      <div class="sn">${esc(it.serial)}</div>
      <div class="ll num">${ll(it.priceLL)}</div>
      <div class="usd num">${usd(it.priceUSD)}</div>
      ${query ? `<div class="cat-tag">${esc(store.categories[ci].name)}</div>` : ''}

/* =====================================================================
   FULL-SCREEN CAMERA SCANNER (portrait, main lens, zoom, autofocus)
   ===================================================================== */
let stream = null, track = null, scanning = false, detector = null, fallbackQr = null, busy = false;
let rearCams = [], camId = null, torchOn = false, lastCode = '', lastTime = 0, scanFrom = 'app';
let zoomCaps = null, curZoom = 1;
const vid = $('vid');
const FORMATS = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','codabar','qr_code'];

const isFront = l => /front|user|selfie|facetime/i.test(l || '');
const isRear = l => /back|rear|environment/i.test(l || '') && !isFront(l);
const isSecondaryLens = l => /ultra|wide|tele|macro|depth/i.test(l || '');

async function listRearCams() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  rearCams = devs.filter(d => isRear(d.label))
    .sort((a, b) => a.label.localeCompare(b.label, undefined, { numeric: true }));
}
// Main camera = first rear camera that is not labelled ultra-wide / tele / macro
function pickMainCam() {
  return rearCams.find(d => !isSecondaryLens(d.label)) || rearCams[0] || null;
}

async function openScanner(from) {
  scanFrom = from || 'app';
  $('scanpage').classList.add('open');
  $('res').classList.remove('show');
  lastCode = ''; lastTime = 0;
  try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('portrait'); } catch (_) {}
  await startStream(null);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
function setStatus(t) { const e = $('sc-status'); e.textContent = t || ''; e.style.display = t ? 'block' : 'none'; }
async function attachStream() {
  vid.muted = true; vid.setAttribute('playsinline', ''); vid.setAttribute('muted', '');
  vid.srcObject = stream;
  try { await vid.play(); } catch (e) { console.warn('play() failed', e); }
}
async function openFirst(deviceId) {
  const hd = { width: { ideal: 1920 }, height: { ideal: 1080 } };
  const attempts = deviceId
    ? [{ deviceId: { exact: deviceId }, ...hd }, { deviceId: { exact: deviceId } }]
    : [{ facingMode: { ideal: 'environment' }, ...hd }, { facingMode: 'environment' }, true];
  let lastErr;
  for (const v of attempts) {
    try { return await navigator.mediaDevices.getUserMedia({ video: v, audio: false }); }
    catch (e) { lastErr = e; if (e.name === 'NotAllowedError' || e.name === 'SecurityError') throw e; await sleep(200); }
  }
  throw lastErr;
}
async function probeBestCam() {
  // Open each rear camera briefly and score it: the main lens has autofocus + hardware zoom,
  // the ultra-wide (0.5x) usually has neither.
  if (rearCams.length < 2) return rearCams[0] ? rearCams[0].id : null;
  let best = null, bestScore = -1e9;
  for (let i = 0; i < Math.min(rearCams.length, 5); i++) {
    const d = rearCams[i];
    try {
      const st = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: d.id } }, audio: false });
      const t = st.getVideoTracks()[0];
      const c = t.getCapabilities ? t.getCapabilities() : {};
      let sc = 0;
      if (c.zoom) sc += 4;
      if (c.zoom && Number(c.zoom.max) >= 4) sc += 1;
      if (c.focusMode && c.focusMode.includes('continuous')) sc += 2;
      if (isSecondaryLens(d.label)) sc -= 5;
      sc -= i * 0.1;
      if (sc > bestScore) { bestScore = sc; best = d.id; }
      st.getTracks().forEach(x => x.stop());
      await sleep(250);
    } catch (e) { console.warn('probe failed', d.label, e); await sleep(250); }
  }
  return best;
}

async function startStream(deviceId) {
  stopStream(false);
  setStatus('Starting camera…');
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('no mediaDevices'), { name: 'InsecureContext' });
    stream = await openFirst(deviceId);
    track = stream.getVideoTracks()[0];
    await attachStream();                 // preview shows immediately

    if (!deviceId) {                      // find & switch to the MAIN rear lens (1x)
      await listRearCams();
      const cur = track.getSettings().deviceId;
      let mainId = localStorage.getItem('pos_main_cam');
      if (!rearCams.some(d => d.id === mainId)) mainId = null;
      if (!mainId) {
        stream.getTracks().forEach(t => t.stop());
        await sleep(300);
        mainId = await probeBestCam();
        if (mainId) localStorage.setItem('pos_main_cam', mainId);
      } else if (mainId !== cur) {
        stream.getTracks().forEach(t => t.stop());
        await sleep(300);
      }
      if (!stream.active || mainId !== cur) {
        try { stream = await openFirst(mainId || null); }
        catch (e) { console.warn('Main lens failed', e); localStorage.removeItem('pos_main_cam'); await sleep(300); stream = await openFirst(null); }
        track = stream.getVideoTracks()[0];
        await attachStream();
      }
    }
    camId = track.getSettings().deviceId || deviceId;
    $('sc-title').textContent = 'Scan Item' + (track.label ? ' · ' + track.label.replace(/,?\s*facing back/i, '') : '');
    setStatus('');
    await setupCameraControls();
    startDetection();
  } catch (err) {
    console.error('Camera error:', err);
    let msg = 'Camera error: ' + (err && (err.name || err.message));
    if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')) msg = 'Camera permission blocked. Chrome ⋮ → Site settings → Camera → Allow, then reload.';
    else if (err && err.name === 'InsecureContext') msg = 'Camera needs HTTPS. Open this page from an https:// link in Chrome.';
    else if (err && err.name === 'NotFoundError') msg = 'No camera found.';
    else if (err && (err.name === 'NotReadableError' || err.name === 'TrackStartError' || err.name === 'AbortError')) msg = 'Camera is busy. Close the Camera app / other tabs, then press back and try again.';
    setStatus(msg); showToast(msg, true);
  }
}

let digitalZoom = false;
function zoomRange() {
  if (zoomCaps && !digitalZoom) return { min: Math.max(1, Number(zoomCaps.min) || 1), max: Math.min(Number(zoomCaps.max) || 1, 10), step: Number(zoomCaps.step) || 0.1 };
  return { min: 1, max: 5, step: 0.1 };
}
async function setupCameraControls() {
  torchOn = false; $('sc-flash').classList.remove('on');
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  try {
    if (caps.focusMode && caps.focusMode.includes('continuous'))
      await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
  } catch (_) {}
  zoomCaps = caps.zoom || null;
  digitalZoom = !zoomCaps;                       // no hardware zoom -> digital zoom fallback
  vid.style.transform = ''; curZoom = 1;
  $('sc-flash').style.display = caps.torch ? '' : 'none';
  $('zoom-row').style.display = 'flex';
  const r = zoomRange(), sl = $('zslider');
  sl.min = r.min; sl.max = r.max; sl.step = r.step;
  await setZoom(1);
}
async function setZoom(z) {
  if (!track) return;
  const r = zoomRange();
  z = Math.min(Math.max(Number(z), r.min), r.max);
  if (!digitalZoom) {
    try { await track.applyConstraints({ advanced: [{ zoom: z }] }); }
    catch (e) {
      try { await track.applyConstraints({ zoom: z }); }
      catch (e2) { console.warn('Hardware zoom failed, using digital', e2); digitalZoom = true; }
    }
  }
  vid.style.transform = digitalZoom ? 'scale(' + z + ')' : '';
  curZoom = z;
  $('zslider').value = z;
  $('zlabel').textContent = z.toFixed(1) + '×' + (digitalZoom ? ' D' : '');
  document.querySelectorAll('.zb').forEach(b => b.classList.toggle('on', Math.abs(Number(b.dataset.z) - z) < 0.15));
}

async function toggleTorch() {
  if (!track) return;
  try {
    torchOn = !torchOn;
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    $('sc-flash').classList.toggle('on', torchOn);
  } catch (e) { torchOn = false; showToast('Flash not available', true); }
}

/* ----- Detection ----- */
function startDetection() {
  scanning = true;
  if (!detector && !fallbackQr && 'BarcodeDetector' in window) {
    try { detector = new BarcodeDetector({ formats: FORMATS }); }
    catch (_) { try { detector = new BarcodeDetector(); } catch (__) { detector = null; } }
  }
  if (!detector && !fallbackQr && window.Html5Qrcode) {
    fallbackQr = new Html5Qrcode('hq', { verbose: false });
  }
  loop();
}
async function loop() {
  if (!scanning) return;
  if (vid.readyState >= 2 && !busy) {
    busy = true;
    try {
      if (detector) {
        const codes = await detector.detect(vid);
        if (codes.length) onCode(codes[0].rawValue);
      } else if (fallbackQr) {
        const c = document.createElement('canvas');
        c.width = vid.videoWidth; c.height = vid.videoHeight;
        c.getContext('2d').drawImage(vid, 0, 0);
        const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
        const text = await fallbackQr.scanFile(new File([blob], 'f.jpg', { type: 'image/jpeg' }), false);
        if (text) onCode(text);
      }
    } catch (_) {}
    busy = false;
  }
  setTimeout(loop, detector ? 80 : 350);
}
function onCode(code) {
  const now = Date.now();
  if (code === lastCode && now - lastTime < 2500) return;   // ignore repeats
  lastCode = code; lastTime = now;
  if (navigator.vibrate) navigator.vibrate(60);
  const found = findItem(code);
  const res = $('res');
  res.classList.add('show'); res.classList.toggle('nf', !found);
  $('r-sn').textContent = 'SN: ' + code;
  $('r-name').textContent = found ? found.name : 'Item not found';
  $('r-ll').textContent = found ? ll(found.priceLL) : '';
  $('r-usd').textContent = found ? usd(found.priceUSD) : '';
}

function stopStream(hide = true) {
  scanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; track = null; vid.srcObject = null;
  if (hide) $('scanpage').classList.remove('open');
}
function closeScanner() {
  stopStream(true);
  try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch (_) {}
  if (scanFrom === 'app') setTimeout(() => $('q').focus(), 50);
}

$('sc-back').addEventListener('click', closeScanner);
$('sc-flash').addEventListener('click', toggleTorch);
$('zslider').addEventListener('input', e => setZoom(e.target.value));
document.querySelectorAll('.zb').forEach(b => b.addEventListener('click', () => setZoom(b.dataset.z)));
$('open-cam').addEventListener('click', () => openScanner('app'));

// Pinch to zoom
let pinchD = 0, pinchZ = 1;
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
$('scanpage').addEventListener('touchstart', e => { if (e.touches.length === 2) { pinchD = dist(e.touches); pinchZ = curZoom; } }, { passive: true });
$('scanpage').addEventListener('touchmove', e => { if (e.touches.length === 2 && pinchD) setZoom(pinchZ * dist(e.touches) / pinchD); }, { passive: true });
$('scanpage').addEventListener('touchend', () => { pinchD = 0; });

// Tap to focus (tries every focus method the camera exposes)
let focusBusy = false;
function focusRing(x, y, ok) {
  const r = document.createElement('div');
  r.style.cssText = 'position:absolute;z-index:6;width:76px;height:76px;margin:-38px 0 0 -38px;border:2px solid ' + (ok ? '#10b981' : '#f59e0b') + ';border-radius:50%;pointer-events:none;transition:all .35s;left:' + x + 'px;top:' + y + 'px;transform:scale(1.5);opacity:1';
  $('scanpage').appendChild(r);
  requestAnimationFrame(() => { r.style.transform = 'scale(1)'; });
  setTimeout(() => { r.style.opacity = '0'; }, 700);
  setTimeout(() => r.remove(), 1100);
}
// Software autofocus: sweep manual focus distance and keep the sharpest picture
function sharpness() {
  const c = sharpness.c || (sharpness.c = document.createElement('canvas'));
  c.width = c.height = 160;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  const w = vid.videoWidth, h = vid.videoHeight, sw = w * 0.4, sh = h * 0.4;
  ctx.drawImage(vid, (w - sw) / 2, (h - sh) / 2, sw, sh, 0, 0, 160, 160);
  const d = ctx.getImageData(0, 0, 160, 160).data;
  let sum = 0;
  for (let y = 0; y < 159; y++) for (let x = 0; x < 159; x++) {
    const i = (y * 160 + x) * 4, g = d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11;
    const gx = d[i + 4] * .3 + d[i + 5] * .59 + d[i + 6] * .11, gy = d[i + 640] * .3 + d[i + 641] * .59 + d[i + 642] * .11;
    sum += (g - gx) * (g - gx) + (g - gy) * (g - gy);
  }
  return sum;
}
async function sweepFocus(caps) {
  const fd = caps.focusDistance, min = Number(fd.min), max = Number(fd.max);
  const set = v => track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: v }] });
  const measure = async v => { await set(v); await sleep(260); return sharpness(); };
  let best = min, bestS = -1;
  const N = 10;
  for (let i = 0; i <= N; i++) {
    const v = min + (max - min) * Math.pow(i / N, 2);        // denser near the camera
    const sc = await measure(v);
    if (sc > bestS) { bestS = sc; best = v; }
  }
  // refine around the best value
  const span = (max - min) / 8;
  for (let i = -2; i <= 2; i++) {
    const v = Math.min(max, Math.max(min, best + i * span / 4));
    const sc = await measure(v);
    if (sc > bestS) { bestS = sc; best = v; }
  }
  await set(best);
  return best;
}
async function refocus(e) {
  if (!track || focusBusy) return;
  const rect = $('scanpage').getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  const modes = caps.focusMode || [];
  const nx = Math.min(1, Math.max(0, e.clientX / innerWidth)), ny = Math.min(1, Math.max(0, e.clientY / innerHeight));
  focusBusy = true;
  let ok = false;
  try {
    if (caps.focusDistance && modes.includes('manual') && vid.videoWidth) {
      showToast('Focusing… hold steady', false, true);
      const v = await sweepFocus(caps);
      showToast('Focused');
      focusRing(px, py, true);
      focusBusy = false;
      return;
    }
    // 1) point of interest + single-shot (best, if supported)
    if (modes.includes('single-shot')) {
      try { await track.applyConstraints({ advanced: [{ focusMode: 'single-shot', pointsOfInterest: [{ x: nx, y: ny }] }] }); ok = true; }
      catch (_) { await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] }); ok = true; }
    }
    // 2) otherwise kick the autofocus: manual -> continuous restarts the AF scan
    else if (modes.includes('continuous')) {
      if (modes.includes('manual')) {
        await track.applyConstraints({ advanced: [{ focusMode: 'manual' }] });
        await sleep(180);
      }
      await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      ok = true;
    }
    // 3) nothing exposed
    if (!modes.length) showToast('This phone does not let Chrome control focus. Keep the phone ~10–15 cm from the barcode.', true);
    else if (modes.includes('single-shot')) setTimeout(() => { track && modes.includes('continuous') && track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}); }, 1800);
  } catch (err) { console.warn('focus failed', err); ok = false; }
  focusRing(px, py, ok);
  setTimeout(() => { focusBusy = false; }, 400);
}
$('scanpage').addEventListener('click', e => {
  if (e.target.closest('button,input,#res,.zoom-row')) return;
  refocus(e);
});

  const s = card.dataset.s, ci = +card.dataset.c;
  if (e.target.closest('[data-edit]')) return editItem(ci, s);
  if (e.target.closest('[data-del]')) return delItem(ci, s);
  toggle(s);
});
const q = $('q');
q.addEventListener('input', () => { query = q.value.trim(); render(); });
q.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const v = q.value.trim(); if (!v) return;
  showScan(v);
  q.value = ''; query = ''; render();
});
</script>
</body>
</html>
